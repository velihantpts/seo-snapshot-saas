<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 476" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" role="img" aria-label="A comparison of the three fixes for duplicate content. rel=canonical keeps both URLs live, points them to a master, and passes ranking signals as a hint — best for parameter, print, and faceted near-duplicates, and is easily reversible. A 301 redirect collapses everything to one URL so the old URL no longer loads, passes signals most strongly as a directive, and is best for http to https, www, and moved or merged pages, but is hard to reverse. noindex keeps a page live for users but removes it from the index, does not consolidate ranking signals, is best for thin pages people still need like internal search results, and is reversible by deleting the tag.">
  <rect x="0" y="0" width="760" height="476" fill="#0b1120"/>
  <text x="40" y="34" fill="#f1f5f9" font-size="16" font-weight="600">Canonical vs 301 vs noindex: which duplicate-content fix?</text>
  <text x="40" y="56" fill="#94a3b8" font-size="12.5">Three tools, three jobs. Pick by what should happen to the duplicate URL.</text>

  <!-- column headers -->
  <rect x="196" y="74" width="170" height="52" rx="10" fill="rgba(129,140,248,0.14)" stroke="#818cf8"/>
  <text x="281" y="98" fill="#c7d2fe" font-size="12.5" font-weight="700" text-anchor="middle" font-family="ui-monospace, monospace">rel="canonical"</text>
  <text x="281" y="116" fill="#a5b4fc" font-size="10.5" text-anchor="middle">point both to a master</text>

  <rect x="374" y="74" width="170" height="52" rx="10" fill="rgba(34,197,94,0.14)" stroke="#22c55e"/>
  <text x="459" y="98" fill="#bbf7d0" font-size="12.5" font-weight="700" text-anchor="middle">301 redirect</text>
  <text x="459" y="116" fill="#86efac" font-size="10.5" text-anchor="middle">collapse to one URL</text>

  <rect x="552" y="74" width="168" height="52" rx="10" fill="rgba(245,158,11,0.14)" stroke="#f59e0b"/>
  <text x="636" y="98" fill="#fcd34d" font-size="12.5" font-weight="700" text-anchor="middle" font-family="ui-monospace, monospace">noindex</text>
  <text x="636" y="116" fill="#fcd34d" font-size="10.5" text-anchor="middle">keep live, drop from index</text>

  <!-- Row: Best fit -->
  <text x="40" y="158" fill="#e2e8f0" font-size="12" font-weight="600">Best fit</text>
  <text x="208" y="158" fill="#cbd5e1" font-size="11">Near-dupes you keep live:</text>
  <text x="208" y="174" fill="#cbd5e1" font-size="11">URL params, print &amp; sort</text>
  <text x="208" y="190" fill="#cbd5e1" font-size="11">views, faceted pages.</text>
  <text x="386" y="158" fill="#cbd5e1" font-size="11">Truly redundant URLs:</text>
  <text x="386" y="174" fill="#cbd5e1" font-size="11">http→https, www vs non-</text>
  <text x="386" y="190" fill="#cbd5e1" font-size="11">www, moved/merged pages.</text>
  <text x="564" y="158" fill="#cbd5e1" font-size="11">Pages users need but</text>
  <text x="564" y="174" fill="#cbd5e1" font-size="11">search shouldn't show:</text>
  <text x="564" y="190" fill="#cbd5e1" font-size="11">internal search, filters.</text>

  <line x1="40" y1="206" x2="720" y2="206" stroke="#334155" stroke-width="1"/>

  <!-- Row: Both URLs stay live? -->
  <text x="40" y="234" fill="#e2e8f0" font-size="12" font-weight="600">Both URLs</text>
  <text x="40" y="249" fill="#e2e8f0" font-size="12" font-weight="600">stay live?</text>
  <text x="281" y="243" fill="#4ade80" font-size="12" font-weight="700" text-anchor="middle">Yes — both load</text>
  <text x="459" y="243" fill="#fca5a5" font-size="12" font-weight="700" text-anchor="middle">No — old URL gone</text>
  <text x="636" y="243" fill="#4ade80" font-size="12" font-weight="700" text-anchor="middle">Yes — both load</text>

  <line x1="40" y1="266" x2="720" y2="266" stroke="#334155" stroke-width="1"/>

  <!-- Row: Consolidates ranking signals? -->
  <text x="40" y="294" fill="#e2e8f0" font-size="12" font-weight="600">Consolidates</text>
  <text x="40" y="309" fill="#e2e8f0" font-size="12" font-weight="600">signals?</text>
  <text x="281" y="298" fill="#fcd34d" font-size="12" font-weight="700" text-anchor="middle">Yes — but a hint</text>
  <text x="281" y="314" fill="#94a3b8" font-size="10" text-anchor="middle">Google may override</text>
  <text x="459" y="298" fill="#4ade80" font-size="12" font-weight="700" text-anchor="middle">Yes — strongest</text>
  <text x="459" y="314" fill="#94a3b8" font-size="10" text-anchor="middle">a directive, not a hint</text>
  <text x="636" y="298" fill="#fca5a5" font-size="12" font-weight="700" text-anchor="middle">No</text>
  <text x="636" y="314" fill="#94a3b8" font-size="10" text-anchor="middle">signals not merged</text>

  <line x1="40" y1="330" x2="720" y2="330" stroke="#334155" stroke-width="1"/>

  <!-- Row: Reversible? -->
  <text x="40" y="358" fill="#e2e8f0" font-size="12" font-weight="600">Reversible?</text>
  <text x="281" y="358" fill="#cbd5e1" font-size="11.5" text-anchor="middle">Easy — edit the tag</text>
  <text x="459" y="358" fill="#cbd5e1" font-size="11.5" text-anchor="middle">Hard — links &amp; cache stick</text>
  <text x="636" y="358" fill="#cbd5e1" font-size="11.5" text-anchor="middle">Easy — remove the tag</text>

  <!-- footer -->
  <rect x="40" y="382" width="680" height="74" rx="12" fill="rgba(129,140,248,0.08)" stroke="#818cf8"/>
  <text x="60" y="410" fill="#c7d2fe" font-size="12.5" font-weight="700">Rule of thumb: should the duplicate stay reachable?</text>
  <text x="60" y="432" fill="#cbd5e1" font-size="12">Yes, and it's a near-dupe → canonical.  Yes, but keep it out of search → noindex.  No, it's redundant → 301.</text>
  <text x="60" y="450" fill="#94a3b8" font-size="11.5">Never mix them on the same URL — a noindex + canonical or a 301 to a noindexed page sends conflicting signals.</text>
</svg>

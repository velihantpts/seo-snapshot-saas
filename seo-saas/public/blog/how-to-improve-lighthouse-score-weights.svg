<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" role="img" aria-label="How the Lighthouse 10+ Performance score is weighted across five lab metrics: Total Blocking Time is 30 percent and is the biggest single lever, usually caused by too much JavaScript; Largest Contentful Paint is 25 percent; Cumulative Layout Shift is 25 percent; First Contentful Paint is 10 percent; and Speed Index is 10 percent. TBT, LCP, and CLS together are 80 percent of the score and each has a real-user field twin — TBT is the lab proxy for INP. FCP and Speed Index are supporting metrics. Remember this is the lab score; Google ranks on field CrUX data.">
  <rect x="0" y="0" width="760" height="480" fill="#0b1120"/>
  <text x="40" y="34" fill="#f1f5f9" font-size="16" font-weight="600">How the Lighthouse Performance score is weighted</text>
  <text x="40" y="56" fill="#94a3b8" font-size="12.5">Lighthouse 10+ is a weighted average of five lab metrics. Three of them have a real-user twin in the field.</text>

  <!-- column headers -->
  <text x="40" y="82" fill="#64748b" font-size="10.5" font-weight="600">METRIC</text>
  <text x="578" y="82" fill="#64748b" font-size="10.5" font-weight="600" text-anchor="end">WEIGHT</text>
  <text x="592" y="82" fill="#64748b" font-size="10.5" font-weight="600">MAPS TO</text>

  <!-- TBT -->
  <text x="40" y="106" fill="#e2e8f0" font-size="13" font-weight="700">TBT</text>
  <text x="40" y="121" fill="#94a3b8" font-size="10.5">Total Blocking Time</text>
  <rect x="200" y="92" width="330" height="34" rx="6" fill="#818cf8"/>
  <text x="212" y="113" fill="#1e1b4b" font-size="11" font-weight="700">biggest lever — usually too much JS</text>
  <text x="578" y="114" fill="#c7d2fe" font-size="13" font-weight="700" text-anchor="end">30%</text>
  <text x="592" y="114" fill="#4ade80" font-size="11">→ INP (field)</text>

  <!-- LCP -->
  <text x="40" y="158" fill="#e2e8f0" font-size="13" font-weight="700">LCP</text>
  <text x="40" y="173" fill="#94a3b8" font-size="10.5">Largest Contentful Paint</text>
  <rect x="200" y="144" width="275" height="34" rx="6" fill="#334155" stroke="#475569"/>
  <text x="578" y="166" fill="#e2e8f0" font-size="13" font-weight="700" text-anchor="end">25%</text>
  <text x="592" y="166" fill="#4ade80" font-size="11">→ LCP (field)</text>

  <!-- CLS -->
  <text x="40" y="210" fill="#e2e8f0" font-size="13" font-weight="700">CLS</text>
  <text x="40" y="225" fill="#94a3b8" font-size="10.5">Cumulative Layout Shift</text>
  <rect x="200" y="196" width="275" height="34" rx="6" fill="#334155" stroke="#475569"/>
  <text x="578" y="218" fill="#e2e8f0" font-size="13" font-weight="700" text-anchor="end">25%</text>
  <text x="592" y="218" fill="#4ade80" font-size="11">→ CLS (field)</text>

  <!-- FCP -->
  <text x="40" y="262" fill="#e2e8f0" font-size="13" font-weight="700">FCP</text>
  <text x="40" y="277" fill="#94a3b8" font-size="10.5">First Contentful Paint</text>
  <rect x="200" y="248" width="110" height="34" rx="6" fill="#334155" stroke="#475569"/>
  <text x="578" y="270" fill="#e2e8f0" font-size="13" font-weight="700" text-anchor="end">10%</text>
  <text x="592" y="270" fill="#64748b" font-size="11">supporting</text>

  <!-- Speed Index -->
  <text x="40" y="314" fill="#e2e8f0" font-size="13" font-weight="700">SI</text>
  <text x="40" y="329" fill="#94a3b8" font-size="10.5">Speed Index</text>
  <rect x="200" y="300" width="110" height="34" rx="6" fill="#334155" stroke="#475569"/>
  <text x="578" y="322" fill="#e2e8f0" font-size="13" font-weight="700" text-anchor="end">10%</text>
  <text x="592" y="322" fill="#64748b" font-size="11">supporting</text>

  <!-- footer -->
  <rect x="40" y="360" width="680" height="98" rx="12" fill="rgba(129,140,248,0.10)" stroke="#818cf8"/>
  <text x="60" y="388" fill="#c7d2fe" font-size="13" font-weight="700">TBT + LCP + CLS = 80% of the score, and all three have a real-user twin in the field.</text>
  <text x="60" y="411" fill="#cbd5e1" font-size="12.5">TBT is the lab stand-in for INP, and high TBT almost always means excess JavaScript. Fix it before you</text>
  <text x="60" y="428" fill="#cbd5e1" font-size="12.5">chase FCP or Speed Index — that is where the points are hiding.</text>
  <text x="60" y="449" fill="#94a3b8" font-size="11.5">Reminder: this is the lab score. Google ranks on field CrUX data, not this number.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" role="img" aria-label="The 50-point pre-deploy SEO checklist for developers, grouped into six areas with their check counts and how to verify each: Meta Tags (10 checks, view-source or curl-grep), Content Structure (8, accessibility tree and headings outline), Performance (10, Lighthouse plus CrUX field data), Security (8, curl -sI response headers), Technical SEO (8, URL Inspection and robots/sitemap), and Accessibility (6, axe DevTools plus keyboard). Below, a pipeline shows wiring it into CI: a staging preview deploy feeds Lighthouse CI for checks 11 to 28 and 45 to 50, a curl -sI step for the security checks 29 to 36, and SEO Snapshot for the meta, schema, and technical items.">
  <defs>
    <marker id="chk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#818cf8"/></marker>
  </defs>
  <rect x="0" y="0" width="760" height="500" fill="#0b1120"/>
  <text x="40" y="34" fill="#f1f5f9" font-size="16" font-weight="600">The 50-point pre-deploy checklist, at a glance</text>
  <text x="40" y="56" fill="#94a3b8" font-size="12.5">Six groups, 50 checks — run them against staging before Google does. Numbers show how many checks live in each group.</text>

  <!-- Row 1 -->
  <!-- Meta Tags -->
  <rect x="40" y="80" width="213" height="100" rx="10" fill="#1e293b" stroke="#334155"/>
  <rect x="50" y="98" width="3" height="64" fill="#818cf8"/>
  <text x="62" y="106" fill="#e2e8f0" font-size="13" font-weight="700">Meta Tags</text>
  <rect x="187" y="92" width="52" height="22" rx="6" fill="rgba(129,140,248,0.15)" stroke="#818cf8"/>
  <text x="213" y="107" fill="#c7d2fe" font-size="10" font-weight="600" text-anchor="middle">10 checks</text>
  <text x="62" y="134" fill="#94a3b8" font-size="11">Verify: view-source · curl | grep</text>
  <text x="62" y="156" fill="#cbd5e1" font-size="10.5">title · description · canonical · OG</text>

  <!-- Content Structure -->
  <rect x="273" y="80" width="213" height="100" rx="10" fill="#1e293b" stroke="#334155"/>
  <rect x="283" y="98" width="3" height="64" fill="#818cf8"/>
  <text x="295" y="106" fill="#e2e8f0" font-size="13" font-weight="700">Content Structure</text>
  <rect x="420" y="92" width="52" height="22" rx="6" fill="rgba(129,140,248,0.15)" stroke="#818cf8"/>
  <text x="446" y="107" fill="#c7d2fe" font-size="10" font-weight="600" text-anchor="middle">8 checks</text>
  <text x="295" y="134" fill="#94a3b8" font-size="11">Verify: a11y tree · headings outline</text>
  <text x="295" y="156" fill="#cbd5e1" font-size="10.5">one H1 · alt text · JSON-LD</text>

  <!-- Performance -->
  <rect x="506" y="80" width="213" height="100" rx="10" fill="#1e293b" stroke="#334155"/>
  <rect x="516" y="98" width="3" height="64" fill="#818cf8"/>
  <text x="528" y="106" fill="#e2e8f0" font-size="13" font-weight="700">Performance</text>
  <rect x="653" y="92" width="52" height="22" rx="6" fill="rgba(129,140,248,0.15)" stroke="#818cf8"/>
  <text x="679" y="107" fill="#c7d2fe" font-size="10" font-weight="600" text-anchor="middle">10 checks</text>
  <text x="528" y="134" fill="#94a3b8" font-size="11">Verify: Lighthouse + CrUX field</text>
  <text x="528" y="156" fill="#cbd5e1" font-size="10.5">LCP · CLS · compression</text>

  <!-- Row 2 -->
  <!-- Security -->
  <rect x="40" y="196" width="213" height="100" rx="10" fill="#1e293b" stroke="#334155"/>
  <rect x="50" y="214" width="3" height="64" fill="#818cf8"/>
  <text x="62" y="222" fill="#e2e8f0" font-size="13" font-weight="700">Security</text>
  <rect x="187" y="208" width="52" height="22" rx="6" fill="rgba(129,140,248,0.15)" stroke="#818cf8"/>
  <text x="213" y="223" fill="#c7d2fe" font-size="10" font-weight="600" text-anchor="middle">8 checks</text>
  <text x="62" y="250" fill="#94a3b8" font-size="11">Verify: curl -sI response headers</text>
  <text x="62" y="272" fill="#cbd5e1" font-size="10.5">HTTPS · HSTS · CSP</text>

  <!-- Technical SEO -->
  <rect x="273" y="196" width="213" height="100" rx="10" fill="#1e293b" stroke="#334155"/>
  <rect x="283" y="214" width="3" height="64" fill="#818cf8"/>
  <text x="295" y="222" fill="#e2e8f0" font-size="13" font-weight="700">Technical SEO</text>
  <rect x="420" y="208" width="52" height="22" rx="6" fill="rgba(129,140,248,0.15)" stroke="#818cf8"/>
  <text x="446" y="223" fill="#c7d2fe" font-size="10" font-weight="600" text-anchor="middle">8 checks</text>
  <text x="295" y="250" fill="#94a3b8" font-size="11">Verify: URL Inspection · /robots.txt</text>
  <text x="295" y="272" fill="#cbd5e1" font-size="10.5">sitemap · redirects · canonical</text>

  <!-- Accessibility -->
  <rect x="506" y="196" width="213" height="100" rx="10" fill="#1e293b" stroke="#334155"/>
  <rect x="516" y="214" width="3" height="64" fill="#818cf8"/>
  <text x="528" y="222" fill="#e2e8f0" font-size="13" font-weight="700">Accessibility</text>
  <rect x="653" y="208" width="52" height="22" rx="6" fill="rgba(129,140,248,0.15)" stroke="#818cf8"/>
  <text x="679" y="223" fill="#c7d2fe" font-size="10" font-weight="600" text-anchor="middle">6 checks</text>
  <text x="528" y="250" fill="#94a3b8" font-size="11">Verify: axe DevTools + keyboard</text>
  <text x="528" y="272" fill="#cbd5e1" font-size="10.5">labels · contrast · focus</text>

  <!-- Footer: wire into CI -->
  <rect x="40" y="316" width="680" height="160" rx="12" fill="rgba(129,140,248,0.08)" stroke="#334155"/>
  <text x="60" y="344" fill="#c7d2fe" font-size="13" font-weight="700">Wire it into the pipeline — test the staging URL, not localhost.</text>

  <rect x="60" y="360" width="130" height="58" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="125" y="384" fill="#e2e8f0" font-size="12" font-weight="600" text-anchor="middle">Staging</text>
  <text x="125" y="402" fill="#94a3b8" font-size="10" text-anchor="middle">preview deploy</text>

  <rect x="230" y="360" width="130" height="58" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="295" y="384" fill="#e2e8f0" font-size="12" font-weight="600" text-anchor="middle">Lighthouse CI</text>
  <text x="295" y="402" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="ui-monospace, monospace">checks 11–28, 45–50</text>

  <rect x="400" y="360" width="130" height="58" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="465" y="384" fill="#e2e8f0" font-size="12" font-weight="600" text-anchor="middle">curl -sI in CI</text>
  <text x="465" y="402" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="ui-monospace, monospace">checks 29–36</text>

  <rect x="570" y="360" width="130" height="58" rx="8" fill="rgba(129,140,248,0.14)" stroke="#818cf8"/>
  <text x="635" y="384" fill="#c7d2fe" font-size="12" font-weight="700" text-anchor="middle">SEO Snapshot</text>
  <text x="635" y="402" fill="#a5b4fc" font-size="10" text-anchor="middle">meta · schema · tech</text>

  <line x1="190" y1="389" x2="230" y2="389" stroke="#818cf8" stroke-width="1.5" marker-end="url(#chk)"/>
  <line x1="360" y1="389" x2="400" y2="389" stroke="#818cf8" stroke-width="1.5" marker-end="url(#chk)"/>
  <line x1="530" y1="389" x2="570" y2="389" stroke="#818cf8" stroke-width="1.5" marker-end="url(#chk)"/>

  <text x="60" y="452" fill="#cbd5e1" font-size="12">The goal isn't 50/50 on every page — it's knowing which checks you skip on purpose, and why.</text>
</svg>

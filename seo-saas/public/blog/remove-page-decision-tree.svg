<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 566" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" role="img" aria-label="Decision tree: use a 301 redirect if the content moved, a 410 or 404 if the page is gone for good, or a noindex tag to keep the page live but out of Google. Never use robots.txt to remove a page.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="566" fill="#0b1120"/>

  <!-- title -->
  <text x="40" y="30" fill="#f1f5f9" font-size="17" font-weight="600">Removing or retiring a page: which method?</text>

  <!-- Q1 -->
  <rect x="40" y="52" width="320" height="66" rx="12" fill="#1e293b" stroke="#334155"/>
  <text x="60" y="82" fill="#e2e8f0" font-size="14" font-weight="600">1. Does the content now live</text>
  <text x="60" y="102" fill="#e2e8f0" font-size="14" font-weight="600">at another URL?</text>
  <!-- A1 outcome -->
  <rect x="440" y="46" width="288" height="78" rx="12" fill="rgba(129,140,248,0.12)" stroke="#818cf8"/>
  <text x="460" y="74" fill="#c7d2fe" font-size="14" font-weight="700">301 redirect</text>
  <text x="460" y="96" fill="#cbd5e1" font-size="12.5">Send it to the new URL.</text>
  <text x="460" y="112" fill="#cbd5e1" font-size="12.5">Passes ranking signal.</text>

  <!-- Q2 -->
  <rect x="40" y="196" width="320" height="66" rx="12" fill="#1e293b" stroke="#334155"/>
  <text x="60" y="226" fill="#e2e8f0" font-size="14" font-weight="600">2. Is it gone for good, with</text>
  <text x="60" y="246" fill="#e2e8f0" font-size="14" font-weight="600">no replacement?</text>
  <!-- A2 outcome -->
  <rect x="440" y="190" width="288" height="78" rx="12" fill="rgba(129,140,248,0.12)" stroke="#818cf8"/>
  <text x="460" y="218" fill="#c7d2fe" font-size="14" font-weight="700">410 Gone (404 is fine too)</text>
  <text x="460" y="240" fill="#cbd5e1" font-size="12.5">The cleanest removal. 410</text>
  <text x="460" y="256" fill="#cbd5e1" font-size="12.5">drops out slightly faster.</text>

  <!-- Q3 -->
  <rect x="40" y="340" width="320" height="66" rx="12" fill="#1e293b" stroke="#334155"/>
  <text x="60" y="370" fill="#e2e8f0" font-size="14" font-weight="600">3. Keep the page live but</text>
  <text x="60" y="390" fill="#e2e8f0" font-size="14" font-weight="600">out of Google?</text>
  <!-- A3 outcome -->
  <rect x="440" y="334" width="288" height="78" rx="12" fill="rgba(129,140,248,0.12)" stroke="#818cf8"/>
  <text x="460" y="362" fill="#c7d2fe" font-size="14" font-weight="700">noindex</text>
  <text x="460" y="384" fill="#cbd5e1" font-size="12.5">Meta tag or X-Robots-Tag.</text>
  <text x="460" y="400" fill="#cbd5e1" font-size="12.5">Keep the page crawlable.</text>

  <!-- arrows Q -> outcome (Yes) -->
  <line x1="360" y1="85" x2="432" y2="85" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="372" y="78" fill="#94a3b8" font-size="11.5">Yes</text>
  <line x1="360" y1="229" x2="432" y2="229" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="372" y="222" fill="#94a3b8" font-size="11.5">Yes</text>
  <line x1="360" y1="373" x2="432" y2="373" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="372" y="366" fill="#94a3b8" font-size="11.5">Yes</text>

  <!-- arrows down (No) -->
  <line x1="200" y1="118" x2="200" y2="190" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="210" y="160" fill="#94a3b8" font-size="11.5">No</text>
  <line x1="200" y1="262" x2="200" y2="334" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="210" y="304" fill="#94a3b8" font-size="11.5">No</text>

  <!-- warning -->
  <rect x="40" y="470" width="688" height="66" rx="12" fill="rgba(239,68,68,0.10)" stroke="#ef4444"/>
  <text x="60" y="500" fill="#fca5a5" font-size="14" font-weight="700">Never use robots.txt to remove a page.</text>
  <text x="60" y="521" fill="#fecaca" font-size="12.5">Google has to crawl the page to see the 404, 410, or noindex. Blocking it strands the signal.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" role="img" aria-label="The three Core Web Vitals and their good, needs-improvement, and poor thresholds. LCP (loading): good is 2.5 seconds or under, needs improvement 2.5 to 4 seconds, poor over 4 seconds. INP (responsiveness): good 200ms or under, needs improvement 200 to 500ms, poor over 500ms. CLS (visual stability): good 0.1 or under, needs improvement 0.1 to 0.25, poor over 0.25. Google grades the 75th percentile of real-user visits.">
  <rect x="0" y="0" width="760" height="430" fill="#0b1120"/>
  <text x="40" y="34" fill="#f1f5f9" font-size="16" font-weight="600">Core Web Vitals: the thresholds</text>

  <!-- legend -->
  <rect x="470" y="22" width="12" height="12" rx="2" fill="#22c55e"/><text x="488" y="32" fill="#94a3b8" font-size="11">Good</text>
  <rect x="540" y="22" width="12" height="12" rx="2" fill="#f59e0b"/><text x="558" y="32" fill="#94a3b8" font-size="11">Needs work</text>
  <rect x="640" y="22" width="12" height="12" rx="2" fill="#ef4444"/><text x="658" y="32" fill="#94a3b8" font-size="11">Poor</text>

  <!-- LCP -->
  <text x="40" y="98" fill="#e2e8f0" font-size="14" font-weight="600">LCP</text>
  <text x="40" y="116" fill="#94a3b8" font-size="11">Loading</text>
  <rect x="150" y="80" width="230" height="34" rx="6" fill="#22c55e" fill-opacity="0.85"/>
  <rect x="380" y="80" width="150" height="34" fill="#f59e0b" fill-opacity="0.85"/>
  <rect x="530" y="80" width="150" height="34" rx="6" fill="#ef4444" fill-opacity="0.85"/>
  <text x="265" y="102" fill="#052e16" font-size="12.5" font-weight="700" text-anchor="middle">≤ 2.5s</text>
  <text x="455" y="102" fill="#451a03" font-size="12" font-weight="600" text-anchor="middle">2.5–4s</text>
  <text x="605" y="102" fill="#450a0a" font-size="12" font-weight="600" text-anchor="middle">&gt; 4s</text>

  <!-- INP -->
  <text x="40" y="178" fill="#e2e8f0" font-size="14" font-weight="600">INP</text>
  <text x="40" y="196" fill="#94a3b8" font-size="11">Responsiveness</text>
  <rect x="150" y="160" width="230" height="34" rx="6" fill="#22c55e" fill-opacity="0.85"/>
  <rect x="380" y="160" width="150" height="34" fill="#f59e0b" fill-opacity="0.85"/>
  <rect x="530" y="160" width="150" height="34" rx="6" fill="#ef4444" fill-opacity="0.85"/>
  <text x="265" y="182" fill="#052e16" font-size="12.5" font-weight="700" text-anchor="middle">≤ 200ms</text>
  <text x="455" y="182" fill="#451a03" font-size="12" font-weight="600" text-anchor="middle">200–500ms</text>
  <text x="605" y="182" fill="#450a0a" font-size="12" font-weight="600" text-anchor="middle">&gt; 500ms</text>

  <!-- CLS -->
  <text x="40" y="258" fill="#e2e8f0" font-size="14" font-weight="600">CLS</text>
  <text x="40" y="276" fill="#94a3b8" font-size="11">Visual stability</text>
  <rect x="150" y="240" width="230" height="34" rx="6" fill="#22c55e" fill-opacity="0.85"/>
  <rect x="380" y="240" width="150" height="34" fill="#f59e0b" fill-opacity="0.85"/>
  <rect x="530" y="240" width="150" height="34" rx="6" fill="#ef4444" fill-opacity="0.85"/>
  <text x="265" y="262" fill="#052e16" font-size="12.5" font-weight="700" text-anchor="middle">≤ 0.1</text>
  <text x="455" y="262" fill="#451a03" font-size="12" font-weight="600" text-anchor="middle">0.1–0.25</text>
  <text x="605" y="262" fill="#450a0a" font-size="12" font-weight="600" text-anchor="middle">&gt; 0.25</text>

  <!-- footer -->
  <rect x="40" y="322" width="680" height="70" rx="12" fill="rgba(129,140,248,0.10)" stroke="#818cf8"/>
  <text x="60" y="350" fill="#c7d2fe" font-size="13" font-weight="700">You are graded on the 75th percentile of real-user visits.</text>
  <text x="60" y="372" fill="#cbd5e1" font-size="12.5">A page "passes" only when at least 75% of visits land in the green band — lab tools like Lighthouse estimate it, but field</text>
  <text x="60" y="388" fill="#cbd5e1" font-size="12.5">data (CrUX) is what Google actually uses. FID was retired in March 2024 and replaced by INP.</text>
</svg>

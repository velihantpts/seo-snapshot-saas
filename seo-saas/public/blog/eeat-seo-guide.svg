<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" role="img" aria-label="E-E-A-T is not four equal letters. Experience, Expertise, and Authoritativeness are three roads that all feed into Trust, which sits in the center. Experience means proving you did the thing with original screenshots and real test numbers. Expertise means a named author with a bio page and Person schema using sameAs. Authoritativeness means off-site reputation you do not control: citations, reviews, and mentions from respected sites. Trust is the goal, earned by the other three, and shown through HTTPS, a real About page, published dates, and primary-source citations. A credentialed expert can still be untrustworthy, and YMYL topics raise the trust bar highest.">
  <defs>
    <marker id="eeatArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#818cf8"/></marker>
  </defs>
  <rect x="0" y="0" width="760" height="500" fill="#0b1120"/>
  <text x="40" y="34" fill="#f1f5f9" font-size="16" font-weight="600">E-E-A-T: three roads into Trust</text>
  <text x="40" y="56" fill="#94a3b8" font-size="12.5">In Google's diagram the letters aren't equal — Trust sits in the center; the other three are how you earn it.</text>

  <!-- pillar boxes -->
  <rect x="40" y="78" width="210" height="96" rx="10" fill="#1e293b" stroke="#334155"/>
  <text x="54" y="104" fill="#c7d2fe" font-size="14" font-weight="600">Experience</text>
  <text x="54" y="122" fill="#94a3b8" font-size="11.5">Prove you did the thing</text>
  <text x="54" y="146" fill="#cbd5e1" font-size="11">Original screenshots, your own</text>
  <text x="54" y="162" fill="#cbd5e1" font-size="11">test numbers, before/after data</text>

  <rect x="275" y="78" width="210" height="96" rx="10" fill="#1e293b" stroke="#334155"/>
  <text x="289" y="104" fill="#c7d2fe" font-size="14" font-weight="600">Expertise</text>
  <text x="289" y="122" fill="#94a3b8" font-size="11.5">Put a real name on it</text>
  <text x="289" y="146" fill="#cbd5e1" font-size="11">Named author + bio page,</text>
  <text x="289" y="162" fill="#cbd5e1" font-size="11" font-family="ui-monospace, monospace">Person schema · sameAs</text>

  <rect x="510" y="78" width="210" height="96" rx="10" fill="#1e293b" stroke="#334155"/>
  <text x="524" y="104" fill="#c7d2fe" font-size="14" font-weight="600">Authoritativeness</text>
  <text x="524" y="122" fill="#94a3b8" font-size="11.5">Reputation you don't control</text>
  <text x="524" y="146" fill="#cbd5e1" font-size="11">Citations, reviews, mentions</text>
  <text x="524" y="162" fill="#cbd5e1" font-size="11">from respected sites, off-site</text>

  <!-- converging arrows -->
  <line x1="145" y1="176" x2="332" y2="296" stroke="#818cf8" stroke-width="1.5" marker-end="url(#eeatArrow)"/>
  <line x1="380" y1="176" x2="380" y2="296" stroke="#818cf8" stroke-width="1.5" marker-end="url(#eeatArrow)"/>
  <line x1="615" y1="176" x2="428" y2="296" stroke="#818cf8" stroke-width="1.5" marker-end="url(#eeatArrow)"/>
  <text x="380" y="242" fill="#a5b4fc" font-size="11" text-anchor="middle">all three feed into ↓</text>

  <!-- Trust node (the center) -->
  <rect x="280" y="300" width="200" height="82" rx="12" fill="rgba(34,197,94,0.12)" stroke="#22c55e"/>
  <text x="380" y="330" fill="#4ade80" font-size="17" font-weight="700" text-anchor="middle">TRUST</text>
  <text x="380" y="350" fill="#bbf7d0" font-size="11.5" text-anchor="middle">The center. What actually matters.</text>
  <text x="380" y="370" fill="#86efac" font-size="10.5" text-anchor="middle" font-family="ui-monospace, monospace">HTTPS · About · dates · sources</text>

  <!-- footer -->
  <rect x="40" y="404" width="680" height="76" rx="12" fill="rgba(129,140,248,0.08)" stroke="#334155"/>
  <text x="60" y="430" fill="#c7d2fe" font-size="13" font-weight="700">A credentialed expert can still be untrustworthy — think undisclosed paid promotion.</text>
  <text x="60" y="452" fill="#cbd5e1" font-size="12.5">Experience, Expertise, and Authority are the roads; Trust is what they build toward.</text>
  <text x="60" y="472" fill="#cbd5e1" font-size="12.5">YMYL topics — health, money, legal, safety — raise the trust bar highest.</text>
</svg>

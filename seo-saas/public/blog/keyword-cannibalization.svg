<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" role="img" aria-label="Keyword cannibalization: two pages targeting the same search intent split the ranking signal, so Google flip-flops between them and neither ranks well. Consolidating them into one page with a 301 redirect combines the signal, so the single page ranks higher.">
  <defs>
    <marker id="z" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#818cf8"/></marker>
  </defs>
  <rect x="0" y="0" width="760" height="440" fill="#0b1120"/>
  <text x="40" y="34" fill="#f1f5f9" font-size="16" font-weight="600">Two pages, one intent — the signal splits</text>

  <!-- BEFORE -->
  <text x="40" y="66" fill="#fca5a5" font-size="12.5" font-weight="700">BEFORE — cannibalizing</text>
  <rect x="40" y="80" width="150" height="46" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="56" y="100" fill="#e2e8f0" font-size="12">/blog/best-shoes</text>
  <text x="56" y="117" fill="#94a3b8" font-size="10.5">targets "best shoes"</text>
  <rect x="40" y="150" width="150" height="46" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="56" y="170" fill="#e2e8f0" font-size="12">/shop/best-shoes</text>
  <text x="56" y="187" fill="#94a3b8" font-size="10.5">targets "best shoes"</text>

  <line x1="190" y1="103" x2="290" y2="128" stroke="#818cf8" stroke-width="1.5" marker-end="url(#z)"/>
  <line x1="190" y1="173" x2="290" y2="148" stroke="#818cf8" stroke-width="1.5" marker-end="url(#z)"/>

  <rect x="292" y="112" width="120" height="52" rx="10" fill="rgba(239,68,68,0.10)" stroke="#ef4444"/>
  <text x="352" y="135" fill="#fca5a5" font-size="12.5" font-weight="700" text-anchor="middle">Google:</text>
  <text x="352" y="153" fill="#fecaca" font-size="11.5" text-anchor="middle">"which one?"</text>

  <text x="430" y="120" fill="#fecaca" font-size="11.5">→ ranking flip-flops week to week</text>
  <text x="430" y="140" fill="#fecaca" font-size="11.5">→ clicks split across two URLs</text>
  <text x="430" y="160" fill="#fecaca" font-size="11.5">→ neither earns full authority</text>

  <line x1="40" y1="228" x2="720" y2="228" stroke="#1e293b" stroke-width="1"/>

  <!-- AFTER -->
  <text x="40" y="262" fill="#4ade80" font-size="12.5" font-weight="700">AFTER — consolidated</text>
  <rect x="40" y="276" width="150" height="46" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="56" y="296" fill="#94a3b8" font-size="12">/blog/best-shoes</text>
  <text x="56" y="313" fill="#94a3b8" font-size="10.5">301 →</text>
  <line x1="190" y1="299" x2="288" y2="299" stroke="#4ade80" stroke-width="1.5" marker-end="url(#z)"/>
  <text x="205" y="291" fill="#4ade80" font-size="10.5">301</text>

  <rect x="290" y="272" width="170" height="54" rx="10" fill="rgba(34,197,94,0.12)" stroke="#22c55e"/>
  <text x="375" y="295" fill="#bbf7d0" font-size="13" font-weight="700" text-anchor="middle">/shop/best-shoes</text>
  <text x="375" y="314" fill="#86efac" font-size="11" text-anchor="middle">one page, combined signal</text>

  <text x="480" y="292" fill="#86efac" font-size="11.5">→ one clear candidate to rank</text>
  <text x="480" y="312" fill="#86efac" font-size="11.5">→ merged links + clicks + relevance</text>

  <!-- footer -->
  <rect x="40" y="356" width="680" height="62" rx="12" fill="rgba(129,140,248,0.10)" stroke="#818cf8"/>
  <text x="60" y="382" fill="#c7d2fe" font-size="13" font-weight="700">Only consolidate when the intent is genuinely the same.</text>
  <text x="60" y="402" fill="#cbd5e1" font-size="12.5">Different intents (a review vs a product page) can and should coexist. Fix real overlap by merging into the stronger URL, then 301 the rest.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" role="img" aria-label="How Google picks a canonical URL. Your rel=canonical tag is only a hint. Google weighs it against internal links, the XML sitemap, 301 redirects, HTTPS over HTTP, and shorter cleaner URLs, then clusters the duplicates and picks one canonical for the group. When the signals agree your declared preference wins; when they conflict Google overrides your tag, which is what the Search Console status Duplicate, Google chose a different canonical means.">
  <defs>
    <marker id="cx" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#818cf8"/></marker>
  </defs>
  <rect x="0" y="0" width="760" height="470" fill="#0b1120"/>
  <text x="40" y="34" fill="#f1f5f9" font-size="16" font-weight="600">How Google actually picks a canonical</text>
  <text x="40" y="56" fill="#94a3b8" font-size="12.5">rel="canonical" is a hint, not a directive — it gets weighed against every other signal.</text>

  <!-- signal boxes -->
  <!-- 1: your tag (the hint) -->
  <rect x="40" y="90" width="300" height="40" rx="8" fill="rgba(129,140,248,0.12)" stroke="#818cf8"/>
  <text x="54" y="107" fill="#c7d2fe" font-size="12.5" font-weight="700" font-family="ui-monospace, monospace">rel="canonical"</text>
  <text x="54" y="123" fill="#a5b4fc" font-size="11">your declared preference — just a HINT</text>

  <!-- 2: internal links -->
  <rect x="40" y="138" width="300" height="40" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="54" y="155" fill="#e2e8f0" font-size="12.5" font-weight="600">Internal links</text>
  <text x="54" y="171" fill="#94a3b8" font-size="11">which URL your own pages point to most</text>

  <!-- 3: sitemap -->
  <rect x="40" y="186" width="300" height="40" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="54" y="203" fill="#e2e8f0" font-size="12.5" font-weight="600">XML sitemap</text>
  <text x="54" y="219" fill="#94a3b8" font-size="11">the version you list to be indexed</text>

  <!-- 4: 301 (strongest) -->
  <rect x="40" y="234" width="300" height="40" rx="8" fill="rgba(34,197,94,0.10)" stroke="#22c55e"/>
  <text x="54" y="251" fill="#bbf7d0" font-size="12.5" font-weight="700">301 redirects</text>
  <text x="54" y="267" fill="#4ade80" font-size="11">a strong vote for the destination</text>

  <!-- 5: https -->
  <rect x="40" y="282" width="300" height="40" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="54" y="299" fill="#e2e8f0" font-size="12.5" font-weight="600">HTTPS over HTTP</text>
  <text x="54" y="315" fill="#94a3b8" font-size="11">the secure version wins, all else equal</text>

  <!-- 6: url shape -->
  <rect x="40" y="330" width="300" height="40" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="54" y="347" fill="#e2e8f0" font-size="12.5" font-weight="600">Shorter, cleaner URL</text>
  <text x="54" y="363" fill="#94a3b8" font-size="11">mild tiebreaker only</text>

  <!-- converging arrows -->
  <line x1="340" y1="110" x2="436" y2="212" stroke="#818cf8" stroke-width="1.4" marker-end="url(#cx)"/>
  <line x1="340" y1="158" x2="436" y2="216" stroke="#818cf8" stroke-width="1.4" marker-end="url(#cx)"/>
  <line x1="340" y1="206" x2="436" y2="219" stroke="#818cf8" stroke-width="1.4" marker-end="url(#cx)"/>
  <line x1="340" y1="254" x2="436" y2="222" stroke="#818cf8" stroke-width="1.4" marker-end="url(#cx)"/>
  <line x1="340" y1="302" x2="436" y2="225" stroke="#818cf8" stroke-width="1.4" marker-end="url(#cx)"/>
  <line x1="340" y1="350" x2="436" y2="228" stroke="#818cf8" stroke-width="1.4" marker-end="url(#cx)"/>

  <!-- decision box -->
  <rect x="442" y="150" width="278" height="140" rx="12" fill="#1e293b" stroke="#818cf8"/>
  <text x="581" y="184" fill="#f1f5f9" font-size="13.5" font-weight="700" text-anchor="middle">Google weighs them all</text>
  <text x="581" y="210" fill="#cbd5e1" font-size="12" text-anchor="middle">Clusters the duplicate URLs and</text>
  <text x="581" y="228" fill="#cbd5e1" font-size="12" text-anchor="middle">picks ONE canonical for the group.</text>
  <text x="581" y="256" fill="#4ade80" font-size="11.5" text-anchor="middle">Signals agree → your pick wins.</text>
  <text x="581" y="274" fill="#fca5a5" font-size="11.5" text-anchor="middle">Signals conflict → Google overrides you.</text>

  <!-- footer -->
  <rect x="40" y="396" width="680" height="56" rx="12" fill="rgba(239,68,68,0.10)" stroke="#ef4444"/>
  <text x="60" y="422" fill="#fca5a5" font-size="13" font-weight="700">"Duplicate, Google chose a different canonical" = your tag lost the vote.</text>
  <text x="60" y="442" fill="#fecaca" font-size="12.5">The fix is rarely "change the tag" — align internal links, sitemap, redirects and protocol on ONE URL.</text>
</svg>

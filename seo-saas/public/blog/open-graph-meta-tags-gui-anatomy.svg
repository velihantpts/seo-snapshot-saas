<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" role="img" aria-label="Anatomy of a social share card: six Open Graph meta tags in the page head each map to one part of the unfurled preview. og:image becomes the picture, og:site_name the small brand line, og:title the bold headline, og:description the blurb, and og:url the domain shown at the bottom. Two rules break cards most often: og:image must be an absolute HTTPS URL sized 1200 by 630, and og:url should equal the canonical URL.">
  <defs>
    <marker id="ogArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#818cf8"/></marker>
  </defs>
  <rect x="0" y="0" width="760" height="460" fill="#0b1120"/>
  <text x="40" y="34" fill="#f1f5f9" font-size="16" font-weight="600">Anatomy of a social share card</text>
  <text x="40" y="56" fill="#94a3b8" font-size="12.5">Six og: tags in your &lt;head&gt; assemble the preview every platform unfurls.</text>

  <!-- column headers -->
  <text x="40" y="86" fill="#a5b4fc" font-size="12" font-weight="600">The six tags in &lt;head&gt;</text>
  <text x="440" y="86" fill="#4ade80" font-size="12" font-weight="600">How it renders</text>

  <!-- LEFT: tag boxes -->
  <!-- og:image -->
  <rect x="40" y="98" width="320" height="30" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="52" y="117" font-size="12" font-family="ui-monospace, monospace"><tspan fill="#c7d2fe">og:image</tspan><tspan fill="#94a3b8">  "https://…/og.png"</tspan></text>
  <!-- og:site_name -->
  <rect x="40" y="136" width="320" height="30" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="52" y="155" font-size="12" font-family="ui-monospace, monospace"><tspan fill="#c7d2fe">og:site_name</tspan><tspan fill="#94a3b8">  "Acme"</tspan></text>
  <!-- og:title -->
  <rect x="40" y="174" width="320" height="30" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="52" y="193" font-size="12" font-family="ui-monospace, monospace"><tspan fill="#c7d2fe">og:title</tspan><tspan fill="#94a3b8">  "Your Page Title"</tspan></text>
  <!-- og:description -->
  <rect x="40" y="212" width="320" height="30" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="52" y="231" font-size="12" font-family="ui-monospace, monospace"><tspan fill="#c7d2fe">og:description</tspan><tspan fill="#94a3b8">  "A compelling…"</tspan></text>
  <!-- og:url -->
  <rect x="40" y="250" width="320" height="30" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="52" y="269" font-size="12" font-family="ui-monospace, monospace"><tspan fill="#c7d2fe">og:url</tspan><tspan fill="#94a3b8">  "https://acme.com/page"</tspan></text>

  <!-- arrows -->
  <line x1="362" y1="113" x2="437" y2="158" stroke="#818cf8" stroke-width="1.5" marker-end="url(#ogArrow)"/>
  <line x1="362" y1="151" x2="437" y2="236" stroke="#818cf8" stroke-width="1.5" marker-end="url(#ogArrow)"/>
  <line x1="362" y1="189" x2="437" y2="260" stroke="#818cf8" stroke-width="1.5" marker-end="url(#ogArrow)"/>
  <line x1="362" y1="227" x2="437" y2="285" stroke="#818cf8" stroke-width="1.5" marker-end="url(#ogArrow)"/>
  <line x1="362" y1="265" x2="437" y2="324" stroke="#818cf8" stroke-width="1.5" marker-end="url(#ogArrow)"/>

  <!-- RIGHT: rendered card -->
  <rect x="440" y="98" width="280" height="242" rx="12" fill="#1e293b" stroke="#334155"/>
  <!-- image area -->
  <rect x="440" y="98" width="280" height="120" rx="12" fill="#0b1120" stroke="#334155"/>
  <rect x="440" y="110" width="280" height="108" fill="#334155" fill-opacity="0.5"/>
  <text x="580" y="152" fill="#cbd5e1" font-size="12.5" font-weight="600" text-anchor="middle">og:image</text>
  <text x="580" y="170" fill="#94a3b8" font-size="11" text-anchor="middle">1200 × 630 · PNG/JPG</text>
  <!-- meta strip -->
  <text x="456" y="240" fill="#94a3b8" font-size="10.5" text-anchor="start" letter-spacing="0.5">ACME.COM</text>
  <text x="456" y="264" fill="#f1f5f9" font-size="14" font-weight="700">Your Page Title</text>
  <text x="456" y="286" fill="#cbd5e1" font-size="11.5">A compelling description, roughly 60–160</text>
  <text x="456" y="302" fill="#cbd5e1" font-size="11.5">characters that sells the click.</text>
  <text x="456" y="328" fill="#64748b" font-size="10.5" font-family="ui-monospace, monospace">https://acme.com/page</text>

  <!-- footer -->
  <rect x="40" y="360" width="680" height="80" rx="12" fill="rgba(129,140,248,0.10)" stroke="#818cf8"/>
  <text x="60" y="386" fill="#c7d2fe" font-size="13" font-weight="700">The two rules that break most cards:</text>
  <text x="60" y="408" fill="#cbd5e1" font-size="12.5">• og:image must be an absolute HTTPS URL — a relative /og.png resolves to nothing for a scraper, and SVG is rejected.</text>
  <text x="60" y="428" fill="#cbd5e1" font-size="12.5">• og:url should equal your canonical URL. Platforms cache their scrape, so re-scrape after you change a tag.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" role="img" aria-label="A decision tree for the Product schema warning that offers, review, or aggregateRating must be specified. Ask which of three things is genuinely true. If you sell it and a price exists, add an offers block with price, priceCurrency, and availability. If real ratings or reviews are visible on the page, add aggregateRating with ratingValue and reviewCount, or a review with author and reviewRating. If nothing is sold or rated, the Product type is wrong: use SoftwareApplication, CreativeWork, or Recipe instead. You only need one of the three, and you must never invent ratings, because fabricated review markup violates Google policy and can trigger a manual action.">
  <defs>
    <marker id="arr-ff" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#818cf8"/></marker>
  </defs>
  <rect x="0" y="0" width="760" height="480" fill="#0b1120"/>
  <text x="40" y="34" fill="#f1f5f9" font-size="16" font-weight="600">Which field clears the warning?</text>
  <text x="40" y="56" fill="#94a3b8" font-size="12.5">Add the one that is genuinely true for your product — you only need one of the three.</text>

  <!-- start node -->
  <rect x="200" y="76" width="360" height="50" rx="10" fill="#1e293b" stroke="#818cf8"/>
  <text x="380" y="98" fill="#e2e8f0" font-size="13" font-weight="700" text-anchor="middle">Product markup with no commercial signal</text>
  <text x="380" y="116" fill="#a5b4fc" font-size="11.5" text-anchor="middle">Ask: which of these is TRUE?</text>

  <!-- arrows to columns -->
  <line x1="360" y1="126" x2="150" y2="160" stroke="#818cf8" stroke-width="1.5" marker-end="url(#arr-ff)"/>
  <line x1="380" y1="126" x2="380" y2="160" stroke="#818cf8" stroke-width="1.5" marker-end="url(#arr-ff)"/>
  <line x1="400" y1="126" x2="610" y2="160" stroke="#818cf8" stroke-width="1.5" marker-end="url(#arr-ff)"/>

  <!-- column 1 question -->
  <rect x="45" y="162" width="200" height="56" rx="9" fill="#1e293b" stroke="#22c55e"/>
  <text x="145" y="187" fill="#bbf7d0" font-size="12.5" font-weight="700" text-anchor="middle">You sell it</text>
  <text x="145" y="206" fill="#94a3b8" font-size="11.5" text-anchor="middle">a price exists</text>

  <!-- column 2 question -->
  <rect x="280" y="162" width="200" height="56" rx="9" fill="#1e293b" stroke="#22c55e"/>
  <text x="380" y="187" fill="#bbf7d0" font-size="12.5" font-weight="700" text-anchor="middle">Real ratings / reviews</text>
  <text x="380" y="206" fill="#94a3b8" font-size="11.5" text-anchor="middle">visible on the page</text>

  <!-- column 3 question -->
  <rect x="515" y="162" width="200" height="56" rx="9" fill="#1e293b" stroke="#f59e0b"/>
  <text x="615" y="187" fill="#fcd34d" font-size="12.5" font-weight="700" text-anchor="middle">Nothing sold or rated</text>
  <text x="615" y="206" fill="#94a3b8" font-size="11.5" text-anchor="middle">it isn't a product</text>

  <!-- arrows question -> outcome -->
  <line x1="145" y1="218" x2="145" y2="250" stroke="#818cf8" stroke-width="1.5" marker-end="url(#arr-ff)"/>
  <line x1="380" y1="218" x2="380" y2="250" stroke="#818cf8" stroke-width="1.5" marker-end="url(#arr-ff)"/>
  <line x1="615" y1="218" x2="615" y2="250" stroke="#818cf8" stroke-width="1.5" marker-end="url(#arr-ff)"/>

  <!-- column 1 outcome -->
  <rect x="45" y="252" width="200" height="120" rx="10" fill="rgba(34,197,94,0.10)" stroke="#22c55e"/>
  <text x="145" y="277" fill="#4ade80" font-size="13" font-weight="700" text-anchor="middle">Add offers</text>
  <text x="145" y="302" fill="#cbd5e1" font-size="11.5" text-anchor="middle" font-family="ui-monospace, monospace">"@type": "Offer"</text>
  <text x="145" y="323" fill="#cbd5e1" font-size="11.5" text-anchor="middle" font-family="ui-monospace, monospace">price</text>
  <text x="145" y="343" fill="#cbd5e1" font-size="11.5" text-anchor="middle" font-family="ui-monospace, monospace">priceCurrency</text>
  <text x="145" y="363" fill="#cbd5e1" font-size="11.5" text-anchor="middle" font-family="ui-monospace, monospace">availability</text>

  <!-- column 2 outcome -->
  <rect x="280" y="252" width="200" height="120" rx="10" fill="rgba(34,197,94,0.10)" stroke="#22c55e"/>
  <text x="380" y="277" fill="#4ade80" font-size="13" font-weight="700" text-anchor="middle">Add aggregateRating</text>
  <text x="380" y="300" fill="#cbd5e1" font-size="11.5" text-anchor="middle" font-family="ui-monospace, monospace">ratingValue + reviewCount</text>
  <text x="380" y="322" fill="#94a3b8" font-size="11.5" text-anchor="middle">— or a single —</text>
  <text x="380" y="343" fill="#4ade80" font-size="12.5" font-weight="700" text-anchor="middle">review</text>
  <text x="380" y="363" fill="#cbd5e1" font-size="11.5" text-anchor="middle" font-family="ui-monospace, monospace">author + reviewRating</text>

  <!-- column 3 outcome -->
  <rect x="515" y="252" width="200" height="120" rx="10" fill="rgba(245,158,11,0.10)" stroke="#f59e0b"/>
  <text x="615" y="277" fill="#fcd34d" font-size="13" font-weight="700" text-anchor="middle">Fix the @type</text>
  <text x="615" y="300" fill="#cbd5e1" font-size="11.5" text-anchor="middle">Product is wrong. Use:</text>
  <text x="615" y="322" fill="#cbd5e1" font-size="11.5" text-anchor="middle" font-family="ui-monospace, monospace">SoftwareApplication</text>
  <text x="615" y="342" fill="#cbd5e1" font-size="11.5" text-anchor="middle" font-family="ui-monospace, monospace">CreativeWork</text>
  <text x="615" y="362" fill="#cbd5e1" font-size="11.5" text-anchor="middle" font-family="ui-monospace, monospace">Recipe</text>

  <!-- footer warning -->
  <rect x="40" y="392" width="680" height="72" rx="12" fill="rgba(239,68,68,0.10)" stroke="#ef4444"/>
  <text x="60" y="419" fill="#fca5a5" font-size="13" font-weight="700">Never invent ratings you don't have.</text>
  <text x="60" y="441" fill="#fecaca" font-size="12.5">Fabricated review markup violates Google's structured-data policy and can trigger a manual action. Real shops</text>
  <text x="60" y="457" fill="#fecaca" font-size="12.5">usually ship offers plus aggregateRating together, but one true field is enough to clear the warning.</text>
</svg>

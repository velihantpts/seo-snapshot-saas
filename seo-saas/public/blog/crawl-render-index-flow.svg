<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" role="img" aria-label="Googlebot processes a page in three stages: Crawl (fetch the raw HTML) then Render (execute JavaScript) then Index (store it for search). robots.txt blocks the Crawl stage; JavaScript content only appears at the Render stage; a noindex tag drops the page at the Index stage.">
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#818cf8"/></marker>
  </defs>
  <rect x="0" y="0" width="760" height="360" fill="#0b1120"/>
  <text x="40" y="34" fill="#f1f5f9" font-size="16" font-weight="600">How Googlebot sees your page</text>

  <!-- stage 1 -->
  <rect x="40" y="70" width="200" height="76" rx="12" fill="#1e293b" stroke="#334155"/>
  <text x="140" y="100" fill="#c7d2fe" font-size="14.5" font-weight="700" text-anchor="middle">1 · Crawl</text>
  <text x="140" y="122" fill="#cbd5e1" font-size="12" text-anchor="middle">Fetch the raw HTML</text>
  <text x="140" y="138" fill="#cbd5e1" font-size="12" text-anchor="middle">the server returns</text>
  <!-- stage 2 -->
  <rect x="280" y="70" width="200" height="76" rx="12" fill="#1e293b" stroke="#334155"/>
  <text x="380" y="100" fill="#c7d2fe" font-size="14.5" font-weight="700" text-anchor="middle">2 · Render</text>
  <text x="380" y="122" fill="#cbd5e1" font-size="12" text-anchor="middle">Execute JavaScript,</text>
  <text x="380" y="138" fill="#cbd5e1" font-size="12" text-anchor="middle">build the final DOM</text>
  <!-- stage 3 -->
  <rect x="520" y="70" width="200" height="76" rx="12" fill="#1e293b" stroke="#334155"/>
  <text x="620" y="100" fill="#c7d2fe" font-size="14.5" font-weight="700" text-anchor="middle">3 · Index</text>
  <text x="620" y="122" fill="#cbd5e1" font-size="12" text-anchor="middle">Store it as eligible</text>
  <text x="620" y="138" fill="#cbd5e1" font-size="12" text-anchor="middle">to appear in search</text>

  <line x1="240" y1="108" x2="276" y2="108" stroke="#818cf8" stroke-width="2" marker-end="url(#a1)"/>
  <line x1="480" y1="108" x2="516" y2="108" stroke="#818cf8" stroke-width="2" marker-end="url(#a1)"/>

  <!-- annotations -->
  <line x1="140" y1="200" x2="140" y2="150" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4 3"/>
  <rect x="40" y="200" width="200" height="66" rx="10" fill="rgba(239,68,68,0.10)" stroke="#ef4444"/>
  <text x="52" y="224" fill="#fca5a5" font-size="12.5" font-weight="700">robots.txt blocks HERE</text>
  <text x="52" y="243" fill="#fecaca" font-size="11.5">Blocked = never fetched,</text>
  <text x="52" y="259" fill="#fecaca" font-size="11.5">so nothing downstream runs.</text>

  <line x1="380" y1="200" x2="380" y2="150" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4 3"/>
  <rect x="280" y="200" width="200" height="66" rx="10" fill="rgba(245,158,11,0.10)" stroke="#f59e0b"/>
  <text x="292" y="224" fill="#fcd34d" font-size="12.5" font-weight="700">JS content appears HERE</text>
  <text x="292" y="243" fill="#fde68a" font-size="11.5">If content needs JS, it is</text>
  <text x="292" y="259" fill="#fde68a" font-size="11.5">absent in the crawled HTML.</text>

  <line x1="620" y1="200" x2="620" y2="150" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="4 3"/>
  <rect x="520" y="200" width="200" height="66" rx="10" fill="rgba(129,140,248,0.12)" stroke="#818cf8"/>
  <text x="532" y="224" fill="#c7d2fe" font-size="12.5" font-weight="700">noindex drops it HERE</text>
  <text x="532" y="243" fill="#cbd5e1" font-size="11.5">Crawled and rendered, but</text>
  <text x="532" y="259" fill="#cbd5e1" font-size="11.5">kept out of the index.</text>

  <text x="40" y="316" fill="#94a3b8" font-size="12">Where a page fails tells you which fix applies: unblock robots.txt, server-render key content, or check the noindex tag.</text>
</svg>

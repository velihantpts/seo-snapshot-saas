<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" role="img" aria-label="How nginx add_header inheritance silently drops security headers. In the broken config, a location /api/ block defines its own add_header for Cache-Control, so nginx discards all headers inherited from the server block and the /api/ response ships Cache-Control only, with X-Frame-Options and X-Content-Type-Options gone. In the fixed config, the same location block re-includes the shared security-headers.conf snippet before adding Cache-Control, so nginx re-emits the full set and every security header plus Cache-Control survives. Rule: add_header is not cumulative, so include the snippet in every block that sets a header and append always so headers also ship on 4xx and 5xx responses.">
  <defs>
    <marker id="nginxDrop" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#818cf8"/></marker>
  </defs>
  <rect x="0" y="0" width="760" height="520" fill="#0b1120"/>
  <text x="40" y="34" fill="#f1f5f9" font-size="16" font-weight="600">The add_header inheritance trap</text>
  <text x="40" y="56" fill="#94a3b8" font-size="12.5">Any add_header inside a block makes nginx forget every header inherited from the parent.</text>

  <!-- ===== LEFT: BROKEN ===== -->
  <rect x="40" y="76" width="330" height="340" rx="12" fill="rgba(239,68,68,0.06)" stroke="#ef4444"/>
  <text x="58" y="102" fill="#fca5a5" font-size="13" font-weight="700">BROKEN</text>
  <text x="58" y="120" fill="#94a3b8" font-size="11">inner block redefines a header</text>

  <!-- server box -->
  <rect x="58" y="132" width="294" height="152" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="72" y="154" fill="#cbd5e1" font-size="11" font-family="ui-monospace, monospace">server {</text>
  <text x="84" y="174" fill="#e2e8f0" font-size="10.5" font-family="ui-monospace, monospace">add_header X-Frame-Options ...;</text>
  <text x="84" y="190" fill="#e2e8f0" font-size="10.5" font-family="ui-monospace, monospace">add_header X-Content-Type-Options ...;</text>

  <!-- inner location box -->
  <rect x="76" y="200" width="258" height="66" rx="6" fill="#0b1120" stroke="#ef4444"/>
  <text x="90" y="220" fill="#cbd5e1" font-size="10.5" font-family="ui-monospace, monospace">location /api/ {</text>
  <text x="102" y="238" fill="#e2e8f0" font-size="10.5" font-family="ui-monospace, monospace">add_header Cache-Control ...;</text>
  <text x="90" y="256" fill="#fca5a5" font-size="10.5">&#10007; inherited headers dropped here</text>

  <text x="72" y="280" fill="#cbd5e1" font-size="11" font-family="ui-monospace, monospace">}</text>

  <!-- arrow to result -->
  <line x1="205" y1="286" x2="205" y2="300" stroke="#818cf8" stroke-width="1.5" marker-end="url(#nginxDrop)"/>

  <!-- result badge -->
  <rect x="58" y="304" width="294" height="100" rx="8" fill="rgba(239,68,68,0.10)" stroke="#334155"/>
  <text x="72" y="326" fill="#94a3b8" font-size="11.5">/api/ response actually ships:</text>
  <text x="72" y="348" fill="#e2e8f0" font-size="11.5" font-family="ui-monospace, monospace">Cache-Control</text>
  <text x="200" y="348" fill="#4ade80" font-size="11.5">&#10003; present</text>
  <text x="72" y="370" fill="#94a3b8" font-size="11.5" font-family="ui-monospace, monospace">X-Frame-Options</text>
  <text x="240" y="370" fill="#fca5a5" font-size="11.5">&#10007; gone</text>
  <text x="72" y="390" fill="#94a3b8" font-size="11.5" font-family="ui-monospace, monospace">X-Content-Type-Options</text>
  <text x="288" y="390" fill="#fca5a5" font-size="11.5">&#10007;</text>

  <!-- ===== RIGHT: FIXED ===== -->
  <rect x="390" y="76" width="330" height="340" rx="12" fill="rgba(34,197,94,0.06)" stroke="#22c55e"/>
  <text x="408" y="102" fill="#bbf7d0" font-size="13" font-weight="700">FIXED</text>
  <text x="408" y="120" fill="#94a3b8" font-size="11">re-include the shared snippet</text>

  <!-- server box -->
  <rect x="408" y="132" width="294" height="152" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="422" y="154" fill="#cbd5e1" font-size="11" font-family="ui-monospace, monospace">server {</text>
  <text x="434" y="174" fill="#a5b4fc" font-size="10.5" font-family="ui-monospace, monospace">include security-headers.conf;</text>

  <!-- inner location box -->
  <rect x="426" y="188" width="258" height="80" rx="6" fill="#0b1120" stroke="#22c55e"/>
  <text x="440" y="208" fill="#cbd5e1" font-size="10.5" font-family="ui-monospace, monospace">location /api/ {</text>
  <text x="452" y="226" fill="#a5b4fc" font-size="10.5" font-family="ui-monospace, monospace">include security-headers.conf;</text>
  <text x="452" y="242" fill="#e2e8f0" font-size="10.5" font-family="ui-monospace, monospace">add_header Cache-Control ...;</text>
  <text x="440" y="260" fill="#4ade80" font-size="10.5">&#10003; full set re-emitted</text>

  <text x="422" y="280" fill="#cbd5e1" font-size="11" font-family="ui-monospace, monospace">}</text>

  <!-- arrow to result -->
  <line x1="555" y1="286" x2="555" y2="300" stroke="#818cf8" stroke-width="1.5" marker-end="url(#nginxDrop)"/>

  <!-- result badge -->
  <rect x="408" y="304" width="294" height="100" rx="8" fill="rgba(34,197,94,0.10)" stroke="#334155"/>
  <text x="422" y="326" fill="#94a3b8" font-size="11.5">/api/ response actually ships:</text>
  <text x="422" y="348" fill="#e2e8f0" font-size="11.5">Strict-Transport, X-Frame, X-Content-Type,</text>
  <text x="422" y="366" fill="#e2e8f0" font-size="11.5">Referrer, Permissions</text>
  <text x="628" y="366" fill="#4ade80" font-size="11.5">&#10003; all</text>
  <text x="422" y="388" fill="#e2e8f0" font-size="11.5">+ Cache-Control</text>
  <text x="540" y="388" fill="#4ade80" font-size="11.5">&#10003;</text>

  <!-- footer -->
  <rect x="40" y="432" width="680" height="74" rx="12" fill="rgba(129,140,248,0.08)" stroke="#818cf8"/>
  <text x="60" y="460" fill="#c7d2fe" font-size="13" font-weight="700">add_header is not cumulative — a block with any add_header discards every inherited one.</text>
  <text x="60" y="482" fill="#cbd5e1" font-size="12.5">Keep all security headers in one snippet and include it in every block that sets a header. Append</text>
  <text x="60" y="499" fill="#cbd5e1" font-size="12.5">always so they also ship on 4xx / 5xx error responses, not just 200s.</text>
</svg>

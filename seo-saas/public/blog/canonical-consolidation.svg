<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" role="img" aria-label="Several duplicate URLs — one with a tracking parameter, one on http, one with a trailing slash — all use rel=canonical to point at a single preferred URL, so Google consolidates the ranking signal onto it. If the canonical points at the wrong URL, Google indexes the wrong page or ignores the tag.">
  <defs>
    <marker id="k" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#818cf8"/></marker>
  </defs>
  <rect x="0" y="0" width="760" height="470" fill="#0b1120"/>
  <text x="40" y="32" fill="#f1f5f9" font-size="16" font-weight="600">How rel=canonical consolidates duplicates</text>

  <!-- variant URLs -->
  <rect x="40" y="60" width="300" height="46" rx="10" fill="#1e293b" stroke="#334155"/>
  <text x="56" y="88" fill="#e2e8f0" font-size="12.5" font-family="ui-monospace, monospace">/page?utm_source=news</text>
  <rect x="40" y="128" width="300" height="46" rx="10" fill="#1e293b" stroke="#334155"/>
  <text x="56" y="156" fill="#e2e8f0" font-size="12.5" font-family="ui-monospace, monospace">http://example.com/page</text>
  <rect x="40" y="196" width="300" height="46" rx="10" fill="#1e293b" stroke="#334155"/>
  <text x="56" y="224" fill="#e2e8f0" font-size="12.5" font-family="ui-monospace, monospace">/page/  (trailing slash)</text>

  <!-- canonical -->
  <rect x="450" y="112" width="280" height="80" rx="12" fill="rgba(129,140,248,0.12)" stroke="#818cf8"/>
  <text x="470" y="142" fill="#c7d2fe" font-size="13" font-weight="700">The one canonical URL</text>
  <text x="470" y="164" fill="#e2e8f0" font-size="12.5" font-family="ui-monospace, monospace">https://example.com/page</text>
  <text x="470" y="182" fill="#cbd5e1" font-size="11.5">Gets all the ranking signal.</text>

  <line x1="340" y1="83" x2="446" y2="140" stroke="#818cf8" stroke-width="1.5" marker-end="url(#k)"/>
  <line x1="340" y1="151" x2="446" y2="152" stroke="#818cf8" stroke-width="1.5" marker-end="url(#k)"/>
  <line x1="340" y1="219" x2="446" y2="164" stroke="#818cf8" stroke-width="1.5" marker-end="url(#k)"/>
  <text x="360" y="120" fill="#a5b4fc" font-size="11">rel=canonical</text>

  <!-- warning -->
  <rect x="40" y="290" width="690" height="70" rx="12" fill="rgba(239,68,68,0.10)" stroke="#ef4444"/>
  <text x="60" y="320" fill="#fca5a5" font-size="13.5" font-weight="700">Point it at the wrong URL and it backfires.</text>
  <text x="60" y="341" fill="#fecaca" font-size="12.5">A canonical to a different page tells Google to index THAT page instead — or, if it looks wrong, Google ignores the tag entirely.</text>

  <text x="40" y="400" fill="#cbd5e1" font-size="12.5">Rules: use one self-referencing, absolute canonical per page; keep it consistent with your sitemap and internal links;</text>
  <text x="40" y="420" fill="#cbd5e1" font-size="12.5">never canonicalize every page to the homepage (a classic mistake that deindexes real pages).</text>
</svg>

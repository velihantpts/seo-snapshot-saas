<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" role="img" aria-label="Anatomy of an SEO title tag: the title element in the HTML head — 'How to Write Title Tags for SEO | SEO Snapshot' — renders as the blue clickable headline in a Google search result. Front-load the primary keyword, put the brand at the end, and keep it under roughly 600 pixels (about 60 characters) or Google truncates it with an ellipsis.">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#818cf8"/></marker>
  </defs>
  <rect x="0" y="0" width="760" height="500" fill="#0b1120"/>
  <text x="40" y="34" fill="#f1f5f9" font-size="16" font-weight="600">Anatomy of an SEO title tag</text>

  <!-- HTML source -->
  <text x="40" y="66" fill="#94a3b8" font-size="12" font-weight="600">IN YOUR HTML &lt;head&gt;</text>
  <rect x="40" y="78" width="680" height="52" rx="10" fill="#1e293b" stroke="#334155"/>
  <text x="58" y="110" font-size="13.5" font-family="ui-monospace, monospace"><tspan fill="#64748b">&lt;title&gt;</tspan><tspan fill="#c7d2fe">How to Write Title Tags for SEO</tspan><tspan fill="#e2e8f0"> | </tspan><tspan fill="#fcd34d">SEO Snapshot</tspan><tspan fill="#64748b">&lt;/title&gt;</tspan></text>

  <line x1="380" y1="130" x2="380" y2="196" stroke="#818cf8" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="392" y="168" fill="#a5b4fc" font-size="11.5">Google renders it as</text>

  <!-- SERP result -->
  <text x="40" y="222" fill="#94a3b8" font-size="12" font-weight="600">IN THE SEARCH RESULT</text>
  <rect x="40" y="234" width="680" height="112" rx="10" fill="#0f172a" stroke="#334155"/>
  <text x="60" y="262" fill="#94a3b8" font-size="12">seosnapshot.dev › blog › how-to-write-title-tags</text>
  <text x="60" y="292" fill="#8ab4f8" font-size="18">How to Write Title Tags for SEO | SEO Snapshot</text>
  <text x="60" y="318" fill="#cbd5e1" font-size="12.5">A step-by-step guide to writing title tags that rank and get clicked —</text>
  <text x="60" y="335" fill="#cbd5e1" font-size="12.5">the format, the length, and the mistakes that make Google rewrite them.</text>

  <!-- labels -->
  <text x="60" y="382" fill="#a5b4fc" font-size="11.5" font-weight="600">▲ Primary keyword, front-loaded</text>
  <text x="360" y="382" fill="#fcd34d" font-size="11.5" font-weight="600">▲ Brand at the end</text>

  <!-- truncation rule -->
  <rect x="40" y="400" width="680" height="66" rx="12" fill="rgba(245,158,11,0.10)" stroke="#f59e0b"/>
  <text x="60" y="428" fill="#fcd34d" font-size="13" font-weight="700">Keep it under ~600px (about 60 characters).</text>
  <text x="60" y="450" fill="#fde68a" font-size="12">Google cuts by pixel width, not character count — anything past the limit ends in an ellipsis, so the least important words go last.</text>
</svg>

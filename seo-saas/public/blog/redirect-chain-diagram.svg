<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" role="img" aria-label="A redirect chain sends /old-url to /temp-url to /final-url in three hops, each adding latency and leaking ranking signal. The fix is a single direct redirect from /old-url straight to /final-url.">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker>
    <marker id="arg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#818cf8"/></marker>
  </defs>
  <rect x="0" y="0" width="760" height="400" fill="#0b1120"/>

  <text x="40" y="34" fill="#fca5a5" font-size="15" font-weight="700">The problem: a redirect chain</text>
  <!-- chain boxes -->
  <rect x="40" y="56" width="180" height="52" rx="10" fill="#1e293b" stroke="#334155"/>
  <text x="130" y="87" fill="#e2e8f0" font-size="13.5" text-anchor="middle" font-family="ui-monospace, monospace">/old-url</text>
  <rect x="290" y="56" width="180" height="52" rx="10" fill="#1e293b" stroke="#334155"/>
  <text x="380" y="87" fill="#e2e8f0" font-size="13.5" text-anchor="middle" font-family="ui-monospace, monospace">/temp-url</text>
  <rect x="540" y="56" width="180" height="52" rx="10" fill="#1e293b" stroke="#334155"/>
  <text x="630" y="87" fill="#e2e8f0" font-size="13.5" text-anchor="middle" font-family="ui-monospace, monospace">/final-url</text>
  <line x1="220" y1="82" x2="286" y2="82" stroke="#64748b" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="253" y="74" fill="#94a3b8" font-size="11" text-anchor="middle">301</text>
  <line x1="470" y1="82" x2="536" y2="82" stroke="#64748b" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="503" y="74" fill="#94a3b8" font-size="11" text-anchor="middle">301</text>
  <text x="40" y="140" fill="#cbd5e1" font-size="12.5">Every hop adds latency and leaks a little ranking signal. Bots may also stop before the end.</text>

  <!-- fix -->
  <text x="40" y="212" fill="#c7d2fe" font-size="15" font-weight="700">The fix: redirect straight to the destination</text>
  <rect x="40" y="234" width="180" height="52" rx="10" fill="#1e293b" stroke="#334155"/>
  <text x="130" y="265" fill="#e2e8f0" font-size="13.5" text-anchor="middle" font-family="ui-monospace, monospace">/old-url</text>
  <rect x="540" y="234" width="180" height="52" rx="10" fill="rgba(129,140,248,0.12)" stroke="#818cf8"/>
  <text x="630" y="265" fill="#c7d2fe" font-size="13.5" text-anchor="middle" font-family="ui-monospace, monospace">/final-url</text>
  <line x1="220" y1="260" x2="536" y2="260" stroke="#818cf8" stroke-width="1.8" marker-end="url(#arg)"/>
  <text x="378" y="252" fill="#a5b4fc" font-size="11.5" text-anchor="middle">one 301, direct</text>
  <text x="40" y="322" fill="#cbd5e1" font-size="12.5">One hop, full signal, no wasted round-trips. When the destination changes, update the</text>
  <text x="40" y="342" fill="#cbd5e1" font-size="12.5">original rule instead of stacking a new redirect on top of the old one.</text>
</svg>

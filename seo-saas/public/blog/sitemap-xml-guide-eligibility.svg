<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" role="img" aria-label="A URL only belongs in your XML sitemap if it clears three gates in sequence. Gate one: is it the canonical version? Non-canonical variants like tracking-parameter or sort duplicates drop out. Gate two: does it return status 200? Redirects, 404s, and soft-404s drop out. Gate three: is it indexable? Pages blocked by noindex or robots.txt disallow drop out. Only URLs that pass all three go in the sitemap, because every entry should be a page you would be happy to see ranking.">
  <defs>
    <marker id="smflow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#818cf8"/></marker>
    <marker id="smdrop" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ef4444"/></marker>
  </defs>
  <rect x="0" y="0" width="760" height="460" fill="#0b1120"/>
  <text x="40" y="34" fill="#f1f5f9" font-size="16" font-weight="600">Which URLs belong in your sitemap</text>
  <text x="40" y="56" fill="#94a3b8" font-size="12.5">Every entry must clear all three gates. One failure and the URL doesn&apos;t belong.</text>

  <!-- source pool -->
  <rect x="40" y="90" width="95" height="54" rx="10" fill="#1e293b" stroke="#334155"/>
  <text x="87" y="114" fill="#e2e8f0" font-size="12.5" font-weight="700" text-anchor="middle">All site</text>
  <text x="87" y="131" fill="#e2e8f0" font-size="12.5" font-weight="700" text-anchor="middle">URLs</text>

  <!-- gate 1 -->
  <rect x="160" y="84" width="120" height="66" rx="10" fill="#1e293b" stroke="#818cf8"/>
  <text x="220" y="112" fill="#c7d2fe" font-size="13" font-weight="700" text-anchor="middle">Canonical?</text>
  <text x="220" y="132" fill="#94a3b8" font-size="10.5" text-anchor="middle">self-referencing</text>

  <!-- gate 2 -->
  <rect x="310" y="84" width="120" height="66" rx="10" fill="#1e293b" stroke="#818cf8"/>
  <text x="370" y="112" fill="#c7d2fe" font-size="13" font-weight="700" text-anchor="middle">Status 200?</text>
  <text x="370" y="132" fill="#94a3b8" font-size="10.5" text-anchor="middle">no redirects</text>

  <!-- gate 3 -->
  <rect x="460" y="84" width="120" height="66" rx="10" fill="#1e293b" stroke="#818cf8"/>
  <text x="520" y="112" fill="#c7d2fe" font-size="13" font-weight="700" text-anchor="middle">Indexable?</text>
  <text x="520" y="132" fill="#94a3b8" font-size="10.5" text-anchor="middle">crawl + index ok</text>

  <!-- success box -->
  <rect x="610" y="84" width="110" height="66" rx="10" fill="rgba(34,197,94,0.12)" stroke="#22c55e"/>
  <text x="665" y="112" fill="#bbf7d0" font-size="12.5" font-weight="700" text-anchor="middle">sitemap.xml</text>
  <text x="665" y="131" fill="#86efac" font-size="10.5" text-anchor="middle">happy to rank</text>

  <!-- flow arrows -->
  <line x1="135" y1="117" x2="158" y2="117" stroke="#818cf8" stroke-width="1.8" marker-end="url(#smflow)"/>
  <line x1="280" y1="117" x2="308" y2="117" stroke="#818cf8" stroke-width="1.8" marker-end="url(#smflow)"/>
  <line x1="430" y1="117" x2="458" y2="117" stroke="#818cf8" stroke-width="1.8" marker-end="url(#smflow)"/>
  <line x1="580" y1="117" x2="608" y2="117" stroke="#22c55e" stroke-width="1.8" marker-end="url(#smflow)"/>
  <text x="595" y="108" fill="#4ade80" font-size="10" text-anchor="middle" font-weight="700">pass</text>

  <!-- drop-out arrows -->
  <line x1="220" y1="150" x2="220" y2="198" stroke="#ef4444" stroke-width="1.5" marker-end="url(#smdrop)"/>
  <line x1="370" y1="150" x2="370" y2="198" stroke="#ef4444" stroke-width="1.5" marker-end="url(#smdrop)"/>
  <line x1="520" y1="150" x2="520" y2="198" stroke="#ef4444" stroke-width="1.5" marker-end="url(#smdrop)"/>
  <text x="234" y="172" fill="#fca5a5" font-size="10" font-weight="700">fail</text>
  <text x="384" y="172" fill="#fca5a5" font-size="10" font-weight="700">fail</text>
  <text x="534" y="172" fill="#fca5a5" font-size="10" font-weight="700">fail</text>

  <!-- fail boxes -->
  <rect x="148" y="200" width="145" height="72" rx="9" fill="rgba(239,68,68,0.10)" stroke="#ef4444"/>
  <text x="220" y="222" fill="#fca5a5" font-size="11.5" font-weight="700" text-anchor="middle">dropped</text>
  <text x="220" y="242" fill="#fecaca" font-size="10.5" text-anchor="middle" font-family="ui-monospace, monospace">?ref=x, ?sort=</text>
  <text x="220" y="260" fill="#fecaca" font-size="10.5" text-anchor="middle">non-canonical dupes</text>

  <rect x="298" y="200" width="145" height="72" rx="9" fill="rgba(239,68,68,0.10)" stroke="#ef4444"/>
  <text x="370" y="222" fill="#fca5a5" font-size="11.5" font-weight="700" text-anchor="middle">dropped</text>
  <text x="370" y="242" fill="#fecaca" font-size="10.5" text-anchor="middle">301 / 302 redirects</text>
  <text x="370" y="260" fill="#fecaca" font-size="10.5" text-anchor="middle">404s &amp; soft-404s</text>

  <rect x="448" y="200" width="145" height="72" rx="9" fill="rgba(239,68,68,0.10)" stroke="#ef4444"/>
  <text x="520" y="222" fill="#fca5a5" font-size="11.5" font-weight="700" text-anchor="middle">dropped</text>
  <text x="520" y="242" fill="#fecaca" font-size="10.5" text-anchor="middle" font-family="ui-monospace, monospace">noindex</text>
  <text x="520" y="260" fill="#fecaca" font-size="10.5" text-anchor="middle">robots.txt disallow</text>

  <!-- footer -->
  <rect x="40" y="300" width="680" height="130" rx="12" fill="rgba(129,140,248,0.08)" stroke="#334155"/>
  <text x="60" y="328" fill="#c7d2fe" font-size="13" font-weight="700">A sitemap is a set of recommendations, not a dump of every URL that returns HTML.</text>
  <text x="60" y="354" fill="#cbd5e1" font-size="12.5">Listing a <tspan font-family="ui-monospace, monospace" fill="#fca5a5">noindex</tspan> URL sends Google two contradictory instructions — &quot;index this&quot; and &quot;don&apos;t index this&quot; —</text>
  <text x="60" y="374" fill="#cbd5e1" font-size="12.5">and Search Console flags it as an error. A sitemap full of junk reads as a low-quality signal.</text>
  <text x="60" y="402" fill="#a5b4fc" font-size="12.5" font-weight="700">Rule of thumb: if you wouldn&apos;t be happy to see the page ranking, it doesn&apos;t go in the sitemap.</text>
</svg>

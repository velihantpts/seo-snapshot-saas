<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" role="img" aria-label="How a Next.js App Router sitemap is built and found: your static and dynamic pages feed app/sitemap.ts, which returns an array of url and lastModified objects; Next.js renders that as /sitemap.xml with a urlset wrapper; search engines discover it via a Sitemap directive in robots.ts and a submission in Search Console. Past 50,000 URLs or 50 MB, generateSitemaps splits output into numbered files under an index. Give each URL a real per-page lastModified date, never new Date() on every entry.">
  <defs>
    <marker id="sm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#818cf8"/></marker>
  </defs>
  <rect x="0" y="0" width="760" height="380" fill="#0b1120"/>
  <text x="40" y="34" fill="#f1f5f9" font-size="16" font-weight="600">How a Next.js sitemap is built and found</text>
  <text x="40" y="56" fill="#94a3b8" font-size="12.5">Your pages feed one file; Next renders the XML; search engines discover it.</text>

  <!-- Node 1: sources -->
  <rect x="40" y="90" width="155" height="130" rx="10" fill="#1e293b" stroke="#334155"/>
  <text x="52" y="114" fill="#a5b4fc" font-size="12.5" font-weight="700">Your pages</text>
  <text x="52" y="140" fill="#e2e8f0" font-size="11">Static routes</text>
  <text x="52" y="156" fill="#94a3b8" font-size="10">hand-kept list</text>
  <text x="52" y="182" fill="#e2e8f0" font-size="11">Dynamic routes</text>
  <text x="52" y="198" fill="#94a3b8" font-size="10" font-family="ui-monospace, monospace">getAllPosts()</text>
  <text x="52" y="214" fill="#94a3b8" font-size="10">DB · CMS · MDX</text>

  <!-- Node 2: sitemap.ts -->
  <rect x="215" y="90" width="155" height="130" rx="10" fill="#1e293b" stroke="#334155"/>
  <text x="227" y="114" fill="#a5b4fc" font-size="12" font-weight="700" font-family="ui-monospace, monospace">app/sitemap.ts</text>
  <text x="227" y="138" fill="#e2e8f0" font-size="11">Default async fn</text>
  <text x="227" y="154" fill="#94a3b8" font-size="10">returns:</text>
  <text x="227" y="176" fill="#c7d2fe" font-size="10" font-family="ui-monospace, monospace">{ url,</text>
  <text x="227" y="190" fill="#c7d2fe" font-size="10" font-family="ui-monospace, monospace">  lastModified }</text>
  <text x="227" y="212" fill="#94a3b8" font-size="9.5" font-family="ui-monospace, monospace">MetadataRoute.Sitemap</text>

  <!-- Node 3: rendered xml -->
  <rect x="390" y="90" width="155" height="130" rx="10" fill="#1e293b" stroke="#334155"/>
  <text x="402" y="114" fill="#a5b4fc" font-size="12" font-weight="700" font-family="ui-monospace, monospace">/sitemap.xml</text>
  <text x="402" y="140" fill="#e2e8f0" font-size="11">Next renders XML</text>
  <text x="402" y="162" fill="#c7d2fe" font-size="10" font-family="ui-monospace, monospace">&lt;urlset&gt; wrapper</text>
  <text x="402" y="184" fill="#94a3b8" font-size="10">you never write</text>
  <text x="402" y="198" fill="#94a3b8" font-size="10">the XML by hand</text>
  <text x="402" y="214" fill="#94a3b8" font-size="10">Content-Type set</text>

  <!-- Node 4: discovery -->
  <rect x="565" y="90" width="155" height="130" rx="10" fill="#1e293b" stroke="#334155"/>
  <text x="577" y="114" fill="#a5b4fc" font-size="12.5" font-weight="700">Discovery</text>
  <text x="577" y="140" fill="#e2e8f0" font-size="11">robots.ts lists it</text>
  <text x="577" y="156" fill="#94a3b8" font-size="10" font-family="ui-monospace, monospace">Sitemap: &lt;url&gt;</text>
  <text x="577" y="182" fill="#e2e8f0" font-size="11">Search Console</text>
  <text x="577" y="198" fill="#94a3b8" font-size="10">submit + watch</text>
  <text x="577" y="214" fill="#94a3b8" font-size="10">URLs read / errors</text>

  <!-- pipeline arrows -->
  <line x1="195" y1="155" x2="215" y2="155" stroke="#818cf8" stroke-width="1.5" marker-end="url(#sm)"/>
  <line x1="370" y1="155" x2="390" y2="155" stroke="#818cf8" stroke-width="1.5" marker-end="url(#sm)"/>
  <line x1="545" y1="155" x2="565" y2="155" stroke="#818cf8" stroke-width="1.5" marker-end="url(#sm)"/>

  <!-- branch down to threshold -->
  <line x1="467" y1="220" x2="467" y2="250" stroke="#818cf8" stroke-width="1.5" marker-end="url(#sm)"/>

  <!-- lastModified callout (green) -->
  <rect x="40" y="250" width="250" height="100" rx="12" fill="rgba(34,197,94,0.10)" stroke="#22c55e"/>
  <text x="55" y="274" fill="#4ade80" font-size="12.5" font-weight="700">lastModified: use a real date</text>
  <text x="55" y="296" fill="#bbf7d0" font-size="10.5">Per-page updatedAt / git date / CMS field.</text>
  <text x="55" y="314" fill="#cbd5e1" font-size="10.5">new Date() on every URL is a dead signal</text>
  <text x="55" y="330" fill="#cbd5e1" font-size="10.5">Google learns to ignore. No date beats a fake one.</text>

  <!-- threshold callout (amber) -->
  <rect x="310" y="250" width="410" height="100" rx="12" fill="rgba(245,158,11,0.10)" stroke="#f59e0b"/>
  <text x="326" y="274" fill="#fcd34d" font-size="12.5" font-weight="700">Past 50,000 URLs or 50 MB: split it</text>
  <text x="326" y="296" fill="#cbd5e1" font-size="10.5" font-family="ui-monospace, monospace">generateSitemaps() → /sitemap/0.xml, /1.xml …</text>
  <text x="326" y="314" fill="#cbd5e1" font-size="10.5">Submit the index at /sitemap.xml; Google crawls each part.</text>
  <text x="326" y="332" fill="#94a3b8" font-size="10">Most sites never reach this — don't split early.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" role="img" aria-label="How the free SEO score weights its 123 checks across seven categories that sum to 100 percent. Meta Tags is 25 percent, Content Quality 18 percent, Technical SEO 17 percent, Performance 15 percent, Security 10 percent, Social and Schema 8 percent, and Accessibility 7 percent. The top three are ranking-critical ceiling-setters (title tag, keyword in H1 and title, indexability); Performance and Security are bigger-effort fixes (render-blocking resources, HTTPS enforcement); Social, Schema and Accessibility are polish (valid structured data, alt text). The score measures on-page and technical SEO only, not backlinks, domain authority, or rankings.">
  <rect x="0" y="0" width="760" height="480" fill="#0b1120"/>
  <text x="40" y="34" fill="#f1f5f9" font-size="16" font-weight="600">How the score weights its 123 checks</text>
  <text x="40" y="56" fill="#94a3b8" font-size="12.5">Seven categories, summing to 100%. Weight tracks impact on ranking, not effort to fix.</text>

  <!-- legend -->
  <rect x="352" y="47" width="12" height="12" rx="2" fill="#818cf8"/><text x="370" y="57" fill="#94a3b8" font-size="11">Ranking-critical</text>
  <rect x="480" y="47" width="12" height="12" rx="2" fill="#f59e0b"/><text x="498" y="57" fill="#94a3b8" font-size="11">Perf &amp; security</text>
  <rect x="612" y="47" width="12" height="12" rx="2" fill="#64748b"/><text x="630" y="57" fill="#94a3b8" font-size="11">Polish</text>

  <!-- Meta Tags 25% -->
  <text x="40" y="96" fill="#e2e8f0" font-size="12.5" font-weight="600">Meta Tags</text>
  <rect x="185" y="80" width="225" height="26" rx="5" fill="#818cf8"/>
  <text x="420" y="98" fill="#a5b4fc" font-size="12.5" font-weight="700">25%</text>
  <text x="470" y="97" fill="#94a3b8" font-size="11">top check: title tag — unique, &lt; 580px</text>

  <!-- Content Quality 18% -->
  <text x="40" y="138" fill="#e2e8f0" font-size="12.5" font-weight="600">Content Quality</text>
  <rect x="185" y="122" width="162" height="26" rx="5" fill="#818cf8"/>
  <text x="357" y="140" fill="#a5b4fc" font-size="12.5" font-weight="700">18%</text>
  <text x="470" y="139" fill="#94a3b8" font-size="11">top check: keyword in H1 + title</text>

  <!-- Technical SEO 17% -->
  <text x="40" y="180" fill="#e2e8f0" font-size="12.5" font-weight="600">Technical SEO</text>
  <rect x="185" y="164" width="153" height="26" rx="5" fill="#818cf8"/>
  <text x="348" y="182" fill="#a5b4fc" font-size="12.5" font-weight="700">17%</text>
  <text x="470" y="181" fill="#94a3b8" font-size="11">top check: indexability</text>

  <!-- Performance 15% -->
  <text x="40" y="222" fill="#e2e8f0" font-size="12.5" font-weight="600">Performance</text>
  <rect x="185" y="206" width="135" height="26" rx="5" fill="#f59e0b"/>
  <text x="330" y="224" fill="#fcd34d" font-size="12.5" font-weight="700">15%</text>
  <text x="470" y="223" fill="#94a3b8" font-size="11">top check: render-blocking resources</text>

  <!-- Security 10% -->
  <text x="40" y="264" fill="#e2e8f0" font-size="12.5" font-weight="600">Security</text>
  <rect x="185" y="248" width="90" height="26" rx="5" fill="#f59e0b"/>
  <text x="285" y="266" fill="#fcd34d" font-size="12.5" font-weight="700">10%</text>
  <text x="470" y="265" fill="#94a3b8" font-size="11">top check: HTTPS with enforcement</text>

  <!-- Social & Schema 8% -->
  <text x="40" y="306" fill="#e2e8f0" font-size="12.5" font-weight="600">Social &amp; Schema</text>
  <rect x="185" y="290" width="72" height="26" rx="5" fill="#64748b"/>
  <text x="267" y="308" fill="#cbd5e1" font-size="12.5" font-weight="700">8%</text>
  <text x="470" y="307" fill="#94a3b8" font-size="11">top check: valid structured data</text>

  <!-- Accessibility 7% -->
  <text x="40" y="348" fill="#e2e8f0" font-size="12.5" font-weight="600">Accessibility</text>
  <rect x="185" y="332" width="63" height="26" rx="5" fill="#64748b"/>
  <text x="258" y="350" fill="#cbd5e1" font-size="12.5" font-weight="700">7%</text>
  <text x="470" y="349" fill="#94a3b8" font-size="11">top check: alt text on images</text>

  <!-- footer -->
  <rect x="40" y="384" width="680" height="76" rx="12" fill="rgba(129,140,248,0.08)" stroke="#334155"/>
  <text x="60" y="412" fill="#c7d2fe" font-size="13" font-weight="700">Fix top-down by weight, but clear indexability first — a noindex or robots block zeros out everything.</text>
  <text x="60" y="434" fill="#cbd5e1" font-size="12.5">The score covers on-page &amp; technical SEO only: what lives in the HTML, headers, and crawl config.</text>
  <text x="60" y="452" fill="#cbd5e1" font-size="12.5">It cannot see backlinks, domain authority, or live rankings — those need external data no page scan can pull.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 490" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" role="img" aria-label="A reference matrix of the six security headers that matter, each row showing the header name, the threat it stops, and a recommended value. Strict-Transport-Security stops SSL-strip downgrade with max-age 31536000 and includeSubDomains. Content-Security-Policy stops XSS injection with default-src self and object-src none. frame-ancestors stops clickjacking with the value none. X-Content-Type-Options stops MIME sniffing with nosniff. Referrer-Policy stops referrer leakage with strict-origin-when-cross-origin. Permissions-Policy stops feature abuse by emptying geolocation, camera, and microphone allow-lists. None of these is a Google ranking factor; HTTPS is the only confirmed security signal, and these headers protect the trust that rankings are built on.">
  <rect x="0" y="0" width="760" height="490" fill="#0b1120"/>
  <text x="40" y="34" fill="#f1f5f9" font-size="16" font-weight="600">The security headers that actually matter</text>
  <text x="40" y="56" fill="#94a3b8" font-size="12.5">Not ranking factors — HTTPS is Google's only confirmed signal. They defend the trust your rankings rest on.</text>

  <!-- table container -->
  <rect x="40" y="72" width="680" height="306" rx="10" fill="#1e293b" stroke="#334155"/>

  <!-- alternating row shading (rows 1,3,5) -->
  <rect x="41" y="102" width="678" height="46" fill="#182234"/>
  <rect x="41" y="194" width="678" height="46" fill="#182234"/>
  <rect x="41" y="286" width="678" height="46" fill="#182234"/>

  <!-- column header band -->
  <text x="52" y="93" fill="#94a3b8" font-size="11" font-weight="700">HEADER</text>
  <text x="228" y="93" fill="#94a3b8" font-size="11" font-weight="700">STOPS</text>
  <text x="372" y="93" fill="#94a3b8" font-size="11" font-weight="700">RECOMMENDED VALUE</text>
  <line x1="41" y1="102" x2="719" y2="102" stroke="#334155"/>

  <!-- column dividers -->
  <line x1="218" y1="72" x2="218" y2="378" stroke="#334155"/>
  <line x1="362" y1="72" x2="362" y2="378" stroke="#334155"/>

  <!-- row 1: HSTS -->
  <text x="52" y="129" fill="#e2e8f0" font-size="10.5" font-weight="600" font-family="ui-monospace, monospace">Strict-Transport-Security</text>
  <text x="228" y="129" fill="#cbd5e1" font-size="11.5">SSL-strip downgrade</text>
  <text x="372" y="129" fill="#a5b4fc" font-size="10.5" font-family="ui-monospace, monospace">max-age=31536000; includeSubDomains</text>

  <!-- row 2: CSP -->
  <text x="52" y="175" fill="#e2e8f0" font-size="10.5" font-weight="600" font-family="ui-monospace, monospace">Content-Security-Policy</text>
  <text x="228" y="175" fill="#cbd5e1" font-size="11.5">XSS injection</text>
  <text x="372" y="175" fill="#a5b4fc" font-size="10.5" font-family="ui-monospace, monospace">default-src 'self'; object-src 'none'</text>

  <!-- row 3: frame-ancestors -->
  <text x="52" y="221" fill="#e2e8f0" font-size="10.5" font-weight="600" font-family="ui-monospace, monospace">frame-ancestors</text>
  <text x="228" y="221" fill="#cbd5e1" font-size="11.5">Clickjacking</text>
  <text x="372" y="221" fill="#a5b4fc" font-size="10.5" font-family="ui-monospace, monospace">frame-ancestors 'none'  (+ X-Frame-Options)</text>

  <!-- row 4: X-Content-Type-Options -->
  <text x="52" y="267" fill="#e2e8f0" font-size="10.5" font-weight="600" font-family="ui-monospace, monospace">X-Content-Type-Options</text>
  <text x="228" y="267" fill="#cbd5e1" font-size="11.5">MIME sniffing</text>
  <text x="372" y="267" fill="#a5b4fc" font-size="10.5" font-family="ui-monospace, monospace">nosniff</text>

  <!-- row 5: Referrer-Policy -->
  <text x="52" y="313" fill="#e2e8f0" font-size="10.5" font-weight="600" font-family="ui-monospace, monospace">Referrer-Policy</text>
  <text x="228" y="313" fill="#cbd5e1" font-size="11.5">Referrer leakage</text>
  <text x="372" y="313" fill="#a5b4fc" font-size="10.5" font-family="ui-monospace, monospace">strict-origin-when-cross-origin</text>

  <!-- row 6: Permissions-Policy -->
  <text x="52" y="359" fill="#e2e8f0" font-size="10.5" font-weight="600" font-family="ui-monospace, monospace">Permissions-Policy</text>
  <text x="228" y="359" fill="#cbd5e1" font-size="11.5">Feature abuse</text>
  <text x="372" y="359" fill="#a5b4fc" font-size="10.5" font-family="ui-monospace, monospace">geolocation=(), camera=(), microphone=()</text>

  <!-- row separators -->
  <line x1="41" y1="148" x2="719" y2="148" stroke="#232f45"/>
  <line x1="41" y1="194" x2="719" y2="194" stroke="#232f45"/>
  <line x1="41" y1="240" x2="719" y2="240" stroke="#232f45"/>
  <line x1="41" y1="286" x2="719" y2="286" stroke="#232f45"/>
  <line x1="41" y1="332" x2="719" y2="332" stroke="#232f45"/>

  <!-- footer callout -->
  <rect x="40" y="396" width="680" height="76" rx="12" fill="rgba(129,140,248,0.10)" stroke="#818cf8"/>
  <text x="60" y="424" fill="#c7d2fe" font-size="13" font-weight="700">Ship order: run CSP in report-only mode first, watch the violation reports, then enforce.</text>
  <text x="60" y="448" fill="#cbd5e1" font-size="12.5">Set every header globally, then loosen per route. Re-test the live URL — not just one server block.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" role="img" aria-label="The hreflang return-tag rule: every language version must link to every other version AND to itself, and each link must be reciprocal. The English, Spanish, and German pages all list each other plus an x-default fallback. If any page fails to link back, Google ignores the whole cluster.">
  <defs>
    <marker id="h" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#818cf8"/></marker>
  </defs>
  <rect x="0" y="0" width="760" height="440" fill="#0b1120"/>
  <text x="40" y="34" fill="#f1f5f9" font-size="16" font-weight="600">The hreflang return-tag rule</text>
  <text x="40" y="56" fill="#94a3b8" font-size="12.5">Every version links to every version — including itself — and the links must be mutual.</text>

  <!-- three page nodes in a triangle -->
  <rect x="300" y="80" width="160" height="58" rx="10" fill="#1e293b" stroke="#334155"/>
  <text x="380" y="105" fill="#e2e8f0" font-size="13" font-weight="700" text-anchor="middle">/en/</text>
  <text x="380" y="124" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="ui-monospace, monospace">hreflang="en"</text>

  <rect x="90" y="270" width="170" height="58" rx="10" fill="#1e293b" stroke="#334155"/>
  <text x="175" y="295" fill="#e2e8f0" font-size="13" font-weight="700" text-anchor="middle">/es/</text>
  <text x="175" y="314" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="ui-monospace, monospace">hreflang="es"</text>

  <rect x="500" y="270" width="170" height="58" rx="10" fill="#1e293b" stroke="#334155"/>
  <text x="585" y="295" fill="#e2e8f0" font-size="13" font-weight="700" text-anchor="middle">/de/</text>
  <text x="585" y="314" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="ui-monospace, monospace">hreflang="de"</text>

  <!-- reciprocal arrows -->
  <line x1="330" y1="138" x2="205" y2="266" stroke="#818cf8" stroke-width="1.5" marker-start="url(#h)" marker-end="url(#h)"/>
  <line x1="430" y1="138" x2="555" y2="266" stroke="#818cf8" stroke-width="1.5" marker-start="url(#h)" marker-end="url(#h)"/>
  <line x1="260" y1="300" x2="500" y2="300" stroke="#818cf8" stroke-width="1.5" marker-start="url(#h)" marker-end="url(#h)"/>

  <!-- self-reference note -->
  <text x="380" y="200" fill="#a5b4fc" font-size="11.5" text-anchor="middle">each page also lists itself + x-default</text>

  <!-- x-default badge -->
  <rect x="300" y="212" width="160" height="30" rx="8" fill="rgba(129,140,248,0.12)" stroke="#818cf8"/>
  <text x="380" y="232" fill="#c7d2fe" font-size="11.5" text-anchor="middle" font-family="ui-monospace, monospace">hreflang="x-default"</text>

  <!-- footer warning -->
  <rect x="40" y="360" width="680" height="58" rx="12" fill="rgba(239,68,68,0.10)" stroke="#ef4444"/>
  <text x="60" y="386" fill="#fca5a5" font-size="13" font-weight="700">Miss one return link and the whole cluster is ignored.</text>
  <text x="60" y="406" fill="#fecaca" font-size="12.5">If /de/ links to /en/ but /en/ doesn't link back to /de/, Google drops the non-reciprocal pair. Use absolute URLs and one x-default.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" role="img" aria-label="How setting image width and height stops layout shift. Without dimensions, the browser gives an image zero height while it loads, then the text below jumps down once bytes arrive, pushing the Cumulative Layout Shift score up. With width and height attributes, the browser computes the aspect ratio and reserves the exact box before the image loads, so nothing below ever moves. The fix is to add width and height matching the natural pixel size plus CSS max-width 100 percent and height auto to stay responsive.">
  <defs>
    <marker id="fiwh" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ef4444"/></marker>
  </defs>
  <rect x="0" y="0" width="760" height="500" fill="#0b1120"/>
  <text x="40" y="34" fill="#f1f5f9" font-size="16" font-weight="600">Set width &amp; height so images don't shift the page</text>
  <text x="40" y="56" fill="#94a3b8" font-size="12.5">Dimensions let the browser draw the box before a single image byte arrives.</text>

  <!-- LEFT PANEL: without dimensions -->
  <rect x="40" y="78" width="330" height="282" rx="12" fill="#1e293b" stroke="#ef4444" stroke-opacity="0.55"/>
  <text x="56" y="102" fill="#fca5a5" font-size="13" font-weight="700">Without width &amp; height</text>

  <!-- frame 1: loading -->
  <rect x="58" y="118" width="130" height="152" rx="6" fill="#0b1120" stroke="#334155"/>
  <rect x="70" y="132" width="70" height="8" rx="2" fill="#475569"/>
  <line x1="70" y1="148" x2="176" y2="148" stroke="#ef4444" stroke-width="1" stroke-dasharray="3 2"/>
  <rect x="70" y="154" width="106" height="6" rx="2" fill="#334155"/>
  <rect x="70" y="166" width="90" height="6" rx="2" fill="#334155"/>
  <rect x="70" y="178" width="98" height="6" rx="2" fill="#334155"/>
  <text x="123" y="252" fill="#94a3b8" font-size="10.5" text-anchor="middle">loading: img is 0px tall</text>

  <!-- frame 2: loaded -->
  <rect x="210" y="118" width="130" height="152" rx="6" fill="#0b1120" stroke="#334155"/>
  <rect x="222" y="132" width="70" height="8" rx="2" fill="#475569"/>
  <rect x="222" y="146" width="106" height="52" rx="3" fill="#1e293b" stroke="#ef4444"/>
  <text x="275" y="176" fill="#fca5a5" font-size="10" text-anchor="middle" font-family="ui-monospace, monospace">IMG</text>
  <rect x="222" y="210" width="106" height="6" rx="2" fill="#334155"/>
  <rect x="222" y="222" width="90" height="6" rx="2" fill="#334155"/>
  <rect x="222" y="234" width="98" height="6" rx="2" fill="#334155"/>
  <line x1="200" y1="150" x2="200" y2="232" stroke="#ef4444" stroke-width="1.5" marker-end="url(#fiwh)"/>
  <text x="275" y="252" fill="#fca5a5" font-size="10.5" text-anchor="middle">loaded: text shoved down</text>

  <text x="205" y="332" fill="#fca5a5" font-size="12" font-weight="700" text-anchor="middle">Every late image nudges CLS up</text>

  <!-- RIGHT PANEL: with dimensions -->
  <rect x="400" y="78" width="320" height="282" rx="12" fill="#1e293b" stroke="#22c55e" stroke-opacity="0.55"/>
  <text x="416" y="102" fill="#86efac" font-size="13" font-weight="700">With width &amp; height (or aspect-ratio)</text>

  <!-- frame 3: loading -->
  <rect x="418" y="118" width="130" height="152" rx="6" fill="#0b1120" stroke="#334155"/>
  <rect x="430" y="132" width="70" height="8" rx="2" fill="#475569"/>
  <rect x="430" y="146" width="106" height="52" rx="3" fill="rgba(34,197,94,0.10)" stroke="#22c55e" stroke-dasharray="4 3"/>
  <text x="483" y="176" fill="#86efac" font-size="9.5" text-anchor="middle">reserved</text>
  <rect x="430" y="210" width="106" height="6" rx="2" fill="#334155"/>
  <rect x="430" y="222" width="90" height="6" rx="2" fill="#334155"/>
  <rect x="430" y="234" width="98" height="6" rx="2" fill="#334155"/>
  <text x="483" y="252" fill="#94a3b8" font-size="10.5" text-anchor="middle">loading: box held open</text>

  <!-- frame 4: loaded -->
  <rect x="570" y="118" width="130" height="152" rx="6" fill="#0b1120" stroke="#334155"/>
  <rect x="582" y="132" width="70" height="8" rx="2" fill="#475569"/>
  <rect x="582" y="146" width="106" height="52" rx="3" fill="#1e293b" stroke="#22c55e"/>
  <text x="635" y="176" fill="#86efac" font-size="10" text-anchor="middle" font-family="ui-monospace, monospace">IMG</text>
  <rect x="582" y="210" width="106" height="6" rx="2" fill="#334155"/>
  <rect x="582" y="222" width="90" height="6" rx="2" fill="#334155"/>
  <rect x="582" y="234" width="98" height="6" rx="2" fill="#334155"/>
  <text x="635" y="252" fill="#86efac" font-size="10.5" text-anchor="middle">loaded: same position</text>

  <line x1="536" y1="242" x2="582" y2="242" stroke="#22c55e" stroke-width="1.2" stroke-dasharray="3 2"/>
  <text x="560" y="332" fill="#86efac" font-size="12" font-weight="700" text-anchor="middle">Space is held — nothing below moves</text>

  <!-- FOOTER: the fix -->
  <rect x="40" y="378" width="680" height="106" rx="12" fill="rgba(129,140,248,0.08)" stroke="#334155"/>
  <text x="60" y="402" fill="#c7d2fe" font-size="13" font-weight="700">The fix — give the browser the intrinsic size, then let CSS scale it:</text>
  <text x="60" y="426" fill="#e2e8f0" font-size="12.5" font-family="ui-monospace, monospace">&lt;img src="hero.webp" width="1600" height="900" alt="…"&gt;</text>
  <text x="60" y="446" fill="#e2e8f0" font-size="12.5" font-family="ui-monospace, monospace">img { max-width: 100%; height: auto; }</text>
  <text x="60" y="470" fill="#cbd5e1" font-size="12">Browser reads 1600×900 → reserves a 16:9 box instantly. height:auto keeps it responsive without re-introducing shift. Aim for CLS &lt; 0.1.</text>
</svg>

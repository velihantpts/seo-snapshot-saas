<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" role="img" aria-label="Choose the right directive by intent. To hide a page from search results use noindex, which still allows crawling and drops the page from the index. To save crawl budget on low-value URLs use Disallow in robots.txt, which blocks crawling but not indexing. To avoid vouching for a link use rel nofollow, sponsored, or ugc, which stops passing ranking authority. The classic trap is combining Disallow with noindex: if robots.txt blocks the URL, Google never crawls it and never sees the noindex tag, so the page can still appear in results.">
  <defs>
    <marker id="nd" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#818cf8"/></marker>
  </defs>
  <rect x="0" y="0" width="760" height="480" fill="#0b1120"/>
  <text x="40" y="34" fill="#f1f5f9" font-size="16" font-weight="600">Pick the directive by what you actually want</text>
  <text x="40" y="56" fill="#94a3b8" font-size="12.5">Three tools, three different jobs — crawling, indexing, and link equity are not the same lever.</text>

  <!-- decision node -->
  <rect x="280" y="78" width="200" height="48" rx="10" fill="#1e293b" stroke="#334155"/>
  <text x="380" y="100" fill="#e2e8f0" font-size="13" font-weight="600" text-anchor="middle">What do you want to do?</text>
  <text x="380" y="118" fill="#94a3b8" font-size="11" text-anchor="middle">choose by intent, not habit</text>

  <!-- branches -->
  <line x1="380" y1="126" x2="150" y2="206" stroke="#818cf8" stroke-width="1.5" marker-end="url(#nd)"/>
  <line x1="380" y1="126" x2="380" y2="206" stroke="#818cf8" stroke-width="1.5" marker-end="url(#nd)"/>
  <line x1="380" y1="126" x2="610" y2="206" stroke="#818cf8" stroke-width="1.5" marker-end="url(#nd)"/>

  <!-- box 1: noindex -->
  <rect x="40" y="210" width="215" height="140" rx="10" fill="#1e293b" stroke="#22c55e"/>
  <text x="56" y="234" fill="#94a3b8" font-size="11">Hide a page from results</text>
  <text x="56" y="260" fill="#4ade80" font-size="16" font-weight="700">noindex</text>
  <text x="56" y="280" fill="#94a3b8" font-size="11" font-family="ui-monospace, monospace">meta tag / X-Robots-Tag</text>
  <text x="56" y="304" fill="#cbd5e1" font-size="11.5">Crawlable, but dropped</text>
  <text x="56" y="320" fill="#cbd5e1" font-size="11.5">from the index.</text>
  <text x="56" y="340" fill="#bbf7d0" font-size="10.5">thank-you, staging, thin pages</text>

  <!-- box 2: Disallow -->
  <rect x="272" y="210" width="215" height="140" rx="10" fill="#1e293b" stroke="#818cf8"/>
  <text x="288" y="234" fill="#94a3b8" font-size="11">Save crawl budget</text>
  <text x="288" y="260" fill="#a5b4fc" font-size="16" font-weight="700">Disallow</text>
  <text x="288" y="280" fill="#94a3b8" font-size="11" font-family="ui-monospace, monospace">robots.txt</text>
  <text x="288" y="304" fill="#cbd5e1" font-size="11.5">Blocks crawling — but</text>
  <text x="288" y="320" fill="#cbd5e1" font-size="11.5">NOT indexing.</text>
  <text x="288" y="340" fill="#c7d2fe" font-size="10.5">a linked URL can still rank</text>

  <!-- box 3: nofollow -->
  <rect x="505" y="210" width="215" height="140" rx="10" fill="#1e293b" stroke="#f59e0b"/>
  <text x="521" y="234" fill="#94a3b8" font-size="11">Don't vouch for a link</text>
  <text x="521" y="260" fill="#fcd34d" font-size="16" font-weight="700">nofollow</text>
  <text x="521" y="280" fill="#94a3b8" font-size="11" font-family="ui-monospace, monospace">rel="nofollow|sponsored|ugc"</text>
  <text x="521" y="304" fill="#cbd5e1" font-size="11.5">Stops passing ranking</text>
  <text x="521" y="320" fill="#cbd5e1" font-size="11.5">authority through a link.</text>
  <text x="521" y="340" fill="#fcd34d" font-size="10.5">paid links, UGC, untrusted</text>

  <!-- footer: the trap -->
  <rect x="40" y="366" width="680" height="94" rx="12" fill="rgba(239,68,68,0.10)" stroke="#ef4444"/>
  <text x="60" y="392" fill="#fca5a5" font-size="13" font-weight="700">The classic trap: never Disallow a page you also want de-indexed.</text>
  <text x="60" y="414" fill="#fecaca" font-size="12.5">If robots.txt blocks the URL, Google never crawls it — so it never sees the noindex tag. The page can</text>
  <text x="60" y="432" fill="#fecaca" font-size="12.5">still surface in results, often as a bare blue link with no snippet. To truly remove a page: allow crawling</text>
  <text x="60" y="450" fill="#fecaca" font-size="12.5">AND serve noindex, then Disallow only after it has dropped out.</text>
</svg>

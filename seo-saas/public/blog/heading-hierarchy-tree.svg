<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" role="img" aria-label="A correct heading outline nests one H1 at the top, then H2 sections, then H3 subsections under them, with no skipped levels. A broken outline jumps from H1 straight to H3, skipping H2, and uses a second H1 for a subsection — which confuses the outline that screen readers and search engines build.">
  <rect x="0" y="0" width="760" height="440" fill="#0b1120"/>
  <text x="40" y="34" fill="#f1f5f9" font-size="16" font-weight="600">One outline, read by Google and screen readers alike</text>

  <!-- GOOD column -->
  <text x="40" y="66" fill="#4ade80" font-size="12.5" font-weight="700">✓ CORRECT — levels nest, none skipped</text>
  <line x1="70" y1="86" x2="70" y2="300" stroke="#334155" stroke-width="1.5"/>
  <rect x="52" y="82" width="90" height="30" rx="6" fill="rgba(34,197,94,0.14)" stroke="#22c55e"/>
  <text x="66" y="102" fill="#bbf7d0" font-size="13" font-weight="700">H1</text>
  <text x="100" y="102" fill="#94a3b8" font-size="11.5">Page title</text>

  <rect x="90" y="126" width="90" height="28" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="104" y="145" fill="#e2e8f0" font-size="12.5">H2</text><text x="138" y="145" fill="#94a3b8" font-size="11">Section</text>
  <rect x="130" y="166" width="90" height="26" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="144" y="184" fill="#cbd5e1" font-size="12">H3</text><text x="176" y="184" fill="#94a3b8" font-size="10.5">Detail</text>
  <rect x="130" y="200" width="90" height="26" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="144" y="218" fill="#cbd5e1" font-size="12">H3</text><text x="176" y="218" fill="#94a3b8" font-size="10.5">Detail</text>
  <rect x="90" y="238" width="90" height="28" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="104" y="257" fill="#e2e8f0" font-size="12.5">H2</text><text x="138" y="257" fill="#94a3b8" font-size="11">Section</text>

  <!-- BROKEN column -->
  <text x="420" y="66" fill="#fca5a5" font-size="12.5" font-weight="700">✗ BROKEN — skips H2, two H1s</text>
  <line x1="450" y1="86" x2="450" y2="300" stroke="#334155" stroke-width="1.5"/>
  <rect x="432" y="82" width="90" height="30" rx="6" fill="rgba(34,197,94,0.10)" stroke="#334155"/>
  <text x="446" y="102" fill="#e2e8f0" font-size="13" font-weight="700">H1</text><text x="480" y="102" fill="#94a3b8" font-size="11.5">Page title</text>

  <rect x="510" y="126" width="120" height="28" rx="6" fill="rgba(239,68,68,0.12)" stroke="#ef4444"/>
  <text x="524" y="145" fill="#fecaca" font-size="12.5">H3</text><text x="556" y="145" fill="#fca5a5" font-size="10.5">jumped a level</text>
  <text x="640" y="145" fill="#ef4444" font-size="16">⚠</text>

  <rect x="470" y="166" width="120" height="28" rx="6" fill="rgba(239,68,68,0.12)" stroke="#ef4444"/>
  <text x="484" y="185" fill="#fecaca" font-size="12.5">H1</text><text x="516" y="185" fill="#fca5a5" font-size="10.5">second H1</text>
  <text x="600" y="185" fill="#ef4444" font-size="16">⚠</text>

  <rect x="510" y="206" width="90" height="26" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="524" y="224" fill="#cbd5e1" font-size="12">H4</text><text x="556" y="224" fill="#94a3b8" font-size="10.5">orphaned</text>

  <!-- footer -->
  <rect x="40" y="330" width="680" height="80" rx="12" fill="rgba(129,140,248,0.10)" stroke="#818cf8"/>
  <text x="60" y="358" fill="#c7d2fe" font-size="13" font-weight="700">The rule: never skip a level on the way down.</text>
  <text x="60" y="380" fill="#cbd5e1" font-size="12.5">Multiple H1s won't get you penalised, but one clear H1 plus properly nested H2/H3 is what powers featured snippets,</text>
  <text x="60" y="396" fill="#cbd5e1" font-size="12.5">"jump to" links, and a screen reader's heading menu. Style with CSS — pick the tag by structure, not by font size.</text>
</svg>
